<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD23F">
<meta name="description" content="Lista de la compra, cesta y control de gastos del súper.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cesta Molona">
<title>La Cesta Molona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a thermal-ticket strip pinned on top holds the money, a price-tag aisle scrolls below, an app tab bar sits at the bottom. */
:root{
  --bg:#EEF1EC;        /* soft grey page */
  --soft:#F1F5F0;      /* light tint for tracks, steppers and badges */
  --surface:#FFFFFF;
  --ink:#17231C;
  --muted:#5B6B60;
  --line:#E0E7DE;
  --basket:#14824A;    /* main green */
  --basket-ink:#FFFFFF;
  --tag:#FFD23F;       /* oferta yellow price tag */
  --tag-ink:#2A2100;
  --hot:#E2452B;       /* tomato for removals and alerts */
  --ticket:#FFD23F;
  --ticket-ink:#26241F;
  --shadow:0 1px 0 rgba(23,35,28,.06),0 6px 18px -10px rgba(23,35,28,.35);
  --f-display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--basket);outline-offset:2px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 84px}

/* ---------- Ticket header ---------- */
.ticket{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -16px;padding:14px 16px 20px;background:var(--ticket);color:var(--ticket-ink);
  --z:10px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/var(--z) 100%;
          mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/var(--z) 100%;
  filter:drop-shadow(0 4px 8px rgba(120,90,0,.28))}
.ticket-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1.5px dashed rgba(38,36,31,.35);padding-bottom:6px;margin-bottom:8px}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:0;text-transform:none;line-height:1}
.brand b{color:#14824A;font-weight:400}
.totals{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:start}
.tot{min-width:0}
.chips.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:6px;margin-top:12px;overflow:visible}
.chips.dgrid .chip{position:relative;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:4px;min-width:0;white-space:normal;text-align:left;font-size:11.5px;line-height:1.15;padding:7px 6px;border-radius:12px;height:100%}
.chips.dgrid .chip .ci{font-size:14px;line-height:1;flex:none}
.chips.dgrid .chip .cn{min-width:0;word-break:normal;overflow-wrap:normal;hyphens:none}
.chips.dgrid .chip .n{font-family:var(--f-mono);font-size:10.5px;font-weight:700;opacity:.65;white-space:nowrap}
.cprow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 10px;width:100%;text-align:left;background:transparent;border:0;padding:4px 0;font:inherit;color:inherit;cursor:pointer;border-radius:8px}
.cprow:hover{background:var(--soft)}
.tot-cycle{position:relative;cursor:pointer}
.tot-cycle .cyc-hint{display:block;font-family:var(--f-mono);font-size:10px;opacity:.6;margin-top:2px}
#cycle-open{position:absolute;inset:-4px;background:transparent;border:0;padding:0;margin:0;cursor:pointer;border-radius:8px}
#cycle-open:focus-visible{outline:2px solid var(--ink,#16231B)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.cal-nav b{font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .dow{font-family:var(--f-mono);font-size:11px;opacity:.6;padding:4px 0}
.cal button{font:inherit;font-weight:600;border:1px solid transparent;background:transparent;border-radius:12px;padding:10px 0;cursor:pointer;color:inherit}
.cal button:hover{background:rgba(0,0,0,.05)}
.cal button.inc{background:var(--soft)}
.cal button.sel{background:var(--basket);color:var(--basket-ink)}
.cal button.today{border-color:currentColor}
.tot small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot strong{display:block;font-family:var(--f-mono);font-weight:700;font-size:clamp(17px,5vw,26px);font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.tot.proj strong{background:var(--ticket-ink);color:var(--ticket);display:inline-block;padding:0 6px;border-radius:4px;transform:rotate(-1.5deg)}
.budget{margin-top:8px;height:8px;border-radius:99px;background:rgba(38,36,31,.12);position:relative;overflow:hidden}
.budget i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14) rotate(-2deg)}100%{transform:scale(1)}}

/* ---------- Generic ---------- */
h2{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;margin:18px 0 10px;text-wrap:balance}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-weight:800}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 140px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{font:inherit;color:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);min-width:0}
input:focus,select:focus{border-color:var(--basket);outline:none}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:var(--basket);color:var(--basket-ink);box-shadow:var(--shadow);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.btn.danger{background:var(--hot);color:#fff}
.btn.yellow{background:var(--tag);color:var(--tag-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}

/* ---------- Search + views ---------- */
.searchbar{position:relative;margin-top:16px}
#li-search{position:sticky;top:0;z-index:22;background:var(--bg);margin-top:0;padding-top:12px;margin-inline:-16px;padding-inline:16px;padding-bottom:2px}
#li-search{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:stretch;padding-bottom:6px}
#li-search .sb-in{position:relative;min-width:0}
#li-search.sfocus{grid-template-columns:minmax(0,1fr)}
#li-search.sfocus #li-cat-slot{display:none}
#li-search input{padding-right:34px}
#li-search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
#liq-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:0;background:var(--muted);color:#fff;font-size:18px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0;cursor:pointer}
#li-search svg{top:50%;left:12px}
#li-search input{padding-left:36px;padding-block:11px;font-size:15px}
#li-cat-slot{min-width:0;display:flex}
#li-cat-slot .catbtn{margin:0;height:100%;padding:8px 10px;font-size:13.5px;min-width:0}
#li-cat-slot .catbtn>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (max-width:360px){#li-cat-slot .catbtn{font-size:12.5px;padding:8px 7px;gap:4px}#li-cat-slot .catbtn .n{display:none}#li-search input{font-size:14px!important}}
.searchbar input{background:var(--soft);padding-left:42px;font-size:16px;border-radius:16px;border-width:2px;padding-block:13px}
.searchbar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}

.group-h{display:flex;align-items:center;gap:8px;margin:20px 2px 8px;font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.group-h .count{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:none}
.group-h .ico{font-size:18px}

.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:10px 10px 10px 8px;box-shadow:var(--shadow)}
.item.in{outline:2px solid var(--basket)}
.info{min-width:0;text-align:left;background:none;border:0;padding:0}
.name{font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:2px;flex-wrap:wrap}
.price{position:relative;font-family:var(--f-mono);font-weight:700;font-size:15px;background:var(--tag);color:var(--tag-ink);padding:5px 9px 5px 14px;border-radius:4px 7px 7px 4px;clip-path:polygon(9px 0,100% 0,100% 100%,9px 100%,0 50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.price::before{content:"";position:absolute;left:5px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--surface)}
.stepper{display:flex;align-items:center;background:var(--soft);border-radius:99px;padding:3px}
.stepper button{width:32px;height:32px;border-radius:50%;border:0;font-size:19px;font-weight:800;line-height:1;display:grid;place-items:center;background:transparent;color:var(--ink)}
.stepper button.plus{background:var(--basket);color:var(--basket-ink)}
.stepper button:disabled{opacity:.3}
.tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff;background:var(--surface);flex:0 0 auto}
.item.picked{outline:2px solid var(--hot);background:color-mix(in srgb,var(--hot) 6%,#fff)}
.item.picked .tick{background:var(--hot);border-color:var(--hot)}
.why{font-size:11px;font-weight:700;color:var(--hot)}
.stepper output{min-width:24px;text-align:center;font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:420px){
  .item{grid-template-columns:36px minmax(0,1fr) auto;grid-template-rows:auto auto;row-gap:6px}
  .item .stepper{grid-column:3;grid-row:1 / span 2}
}

.empty{text-align:center;padding:34px 18px;border:2px dashed var(--line);border-radius:20px;margin-top:18px}
.empty .big{font-family:var(--f-display);font-size:24px;line-height:1.1;margin-bottom:6px}
.empty p{max-width:42ch;margin:0 auto 14px;color:var(--muted)}

/* ---------- Cart / Month ---------- */
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.subtotal{display:flex;justify-content:space-between;font-family:var(--f-mono);font-weight:700;padding-top:10px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:118px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px}
.bar span:last-child{text-align:right;font-family:var(--f-mono)}
.round{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:18px;font-weight:800}
.x{border:0;background:transparent;color:var(--hot);font-size:20px;font-weight:800}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.picked{background:var(--ink);color:var(--bg);border-color:var(--ink)}



.lista{padding:4px 14px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.li:last-of-type{border-bottom:0}
#le .field,#ed .field{flex:none}
[hidden]{display:none!important}
.stack > .field{flex:none}
.li{grid-template-columns:minmax(0,1fr) auto auto}
.lidel{border:0;background:none;color:#E2452B;font-size:15px;padding:6px 4px;border-radius:8px;white-space:nowrap;font-weight:700}
.lidel.on{background:#E2452B;color:#fff;font-size:12px;padding:6px 8px}












.stepper.sm{padding:2px}
.stepper.sm button{width:24px;height:24px;font-size:15px}
.stepper.sm output{min-width:18px;font-size:13px}




.li-fq{grid-column:2;display:flex;align-items:center;gap:10px;margin-top:6px}
.li-fq .falta{vertical-align:0}
.li-fq.appear{animation:fqIn .28s ease-out both;overflow:hidden}
@keyframes fqIn{from{opacity:0;max-height:0;margin-top:0}to{opacity:1;max-height:48px;margin-top:6px}}
.li-step button:disabled{opacity:1}
.fbtn{border:0;cursor:pointer;font-size:11px;padding:5px 9px;border-radius:6px;line-height:1.1;white-space:nowrap}
.fbtn.got{background:#8a948e;color:#fff}
.li.got .li-name,.li.got .lpb{opacity:.5}
.li.got .li-step{opacity:.45}
.li.on.got .box{background:#C9CFCB;border-color:#A7AFAA;color:#5E6761;transform:none}
.li-step button{width:28px;height:28px;font-size:17px}
@media (max-width:360px){.li.on .lpb{align-self:start}.li-fq{gap:6px}.li-step{padding:2px}.li-step button{width:24px;height:24px;font-size:15px}.li-step output{min-width:18px}.li-fq .fbtn{padding:4px 6px}}
.li-name{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.li-tog .box{padding:0;cursor:pointer;background:var(--surface)}
.li-tog{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:10px;row-gap:0;align-items:center;border:0;background:transparent;text-align:left;font:inherit;color:inherit;padding:4px 0;min-width:0}
.lpb{border:0;background:transparent;font:inherit;color:inherit;padding:4px 0 4px 6px;text-align:right;border-radius:8px}
.lpb:hover{background:var(--soft)}





.sp{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;background:var(--soft);border-radius:99px;padding:2px 8px;color:var(--muted)}
.sp b{color:var(--ink)}
.sp.win{background:color-mix(in srgb,var(--basket) 14%,#fff);color:var(--basket)}
.sp.win b{color:var(--basket)}
.cmp-sub{grid-column:1 / 3;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.cmp-act{grid-column:3;display:flex;gap:4px;justify-content:flex-end}
.cmp-act .btn{padding:4px 10px;font-size:12px}








.delb{margin-left:auto;border:1.5px solid transparent;background:none;color:#E2452B;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}
.delb.on{background:#E2452B;color:#fff}



.chip[disabled]{opacity:.4}









.lista-head{margin-top:16px}
.li-acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:stretch}
.li-sticky .lista-head{padding:0!important;border:0;box-shadow:none;background:transparent}
.li-acts .chip{justify-content:center;text-align:center;white-space:normal;line-height:1.15;font-size:12.5px;padding:7px 6px;border-radius:12px;min-height:40px;min-width:0}
.li-acts .chip.on{background:var(--hot);border-color:var(--hot);color:#fff}
.li-acts .li-gocart{background:var(--basket);border-color:var(--basket);color:var(--basket-ink)}
@media (max-width:380px){.li-acts .chip{font-size:11.5px;padding:6px 6px}.li-acts{gap:4px}}
.addchip{border-color:var(--basket)!important;color:var(--basket);font-weight:800}
.addchip .pl{font-weight:900;font-family:system-ui,sans-serif}




.li-sticky{position:sticky;top:0;z-index:20;background:var(--bg);margin-inline:-16px;padding:8px 16px 10px;box-shadow:0 8px 12px -12px rgba(23,35,28,.45)}
.li-sticky .lista-head,.li-sticky .cart-head{margin-top:0;padding:10px 14px}




.le-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.le-title h2{margin:0;font-size:24px}

@media (max-width:380px){.le-title h2{font-size:18px;white-space:nowrap}.le-title .btn.sm{padding:6px 10px;font-size:12.5px}.le-title{gap:4px}.le-title .row{gap:4px!important}}
@media (max-width:340px){.le-title h2{font-size:16px}.le-title .btn.sm{padding:6px 8px;font-size:12px}}


@keyframes lsr{from{opacity:.35;transform:translateX(14px)}}@keyframes lsl{from{opacity:.35;transform:translateX(-14px)}}
.lesup{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:4px 2px;font:inherit;color:inherit;cursor:pointer;border-radius:8px;text-align:left}
.lesup .radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;display:inline-block}
.lesup.on .radio{border-color:var(--basket);background:radial-gradient(circle,var(--basket) 0 45%,transparent 50%)}
.lesup.on{font-weight:700}
.le-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.le-pair .field{min-width:0}
.le-pair select{width:100%;min-width:0}
.le-pair select,.le-pair input{height:48px;box-sizing:border-box}
.le-pair{position:relative}
/* The field being typed in widens to the whole row (toggled from JS: iPhone blurs fields when :has(:focus) is used) */
.le-pair.w1 .field:first-child input,.le-pair.w2 .field:last-child input{position:absolute;left:0;right:0;bottom:0;width:100%;z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.le-pair.w1 .field:last-child label,.le-pair.w2 .field:first-child label{visibility:hidden}
.le-pair.w2 .field:last-child label{position:absolute;left:0;top:0}
.le-supdel{flex:0 0 auto;padding:6px 2px!important}
.le-secbtn{width:100%;height:48px;box-sizing:border-box;margin:0!important;font-weight:500}
.le-secbtn .lsb-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.scrim.sub{z-index:56}
.li-desc{display:block;font-size:12.5px;font-weight:500;color:var(--muted);line-height:1.25;margin-top:1px}


.gbar-wrap{padding-top:10px;padding-bottom:10px}
.gbar{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.gbar .chip{padding:6px 10px;font-size:12.5px}
.gnav{display:inline-flex;align-items:center;gap:2px}
.gnav .chip{padding:5px 9px;font-weight:800}
.gmes{font-weight:800;font-size:13px;padding:0 3px}
.gtot{margin-left:auto;font-family:var(--f-mono);font-weight:800;font-size:16px;white-space:nowrap}
@media (max-width:360px){.gcat{font-size:10.5px;padding:7px 1px;letter-spacing:-.02em}.gcats{gap:4px}}
@media (max-width:340px){.tabbar button{font-size:8.5px!important;letter-spacing:-.03em}}
@media (max-width:380px){.gbar{gap:4px}.gbar .chip{padding:5px 7px;font-size:11.5px}.gtot{font-size:13.5px}}
.gcats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}

/* ---------- Tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabbar nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;width:100%;max-width:600px}

@media (max-width:380px){.tabbar button{font-size:10px}}
.cmp{border:0;border-radius:99px;padding:3px 9px;font-size:11.5px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;background:var(--soft);color:var(--muted)}
.cmp.best{background:color-mix(in srgb,var(--basket) 16%,transparent);color:var(--basket)}
.cmp:hover{filter:brightness(1.05)}
.cmprow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.cmprow:last-child{border-bottom:0}
.cmprow .track{height:14px;background:var(--soft);border-radius:99px;overflow:hidden}
.cmprow .fill{height:100%;border-radius:99px}
.cmprow.win .fill{box-shadow:0 0 0 2px var(--tag) inset}
.winner{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--tag);color:var(--tag-ink);border-radius:4px;padding:1px 5px;margin-left:4px}
/* recommendation */

.hero-reco .where{font-family:var(--f-display);font-size:clamp(26px,8vw,36px);line-height:1.05;margin:2px 0 8px;text-wrap:balance}
.hero-reco .stamp{flex:0 0 auto;transform:rotate(4deg);background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-weight:700;padding:6px 14px 6px 12px;border-radius:6px;font-size:15px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.hero-reco p{margin:0;max-width:52ch}
.hero-reco .hr-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-reco .hr-lab{font-size:15px;font-weight:700;opacity:.9;white-space:nowrap}
.hero-reco .hr-top .stamp{font-size:13px;padding:4px 10px}

.plan-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.plan-line:last-child{border-bottom:0}
.save{font-size:12px;color:var(--basket);font-weight:700}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.opt:last-child{border-bottom:0}
.opt .track{grid-column:1 / -1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.opt .fill{height:100%;background:var(--muted);border-radius:99px;opacity:.5}
.opt.rec .fill{background:var(--basket);opacity:1}
.opt small{color:var(--muted)}
.tabbar button{border:0;background:transparent;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.tabbar button .ti{font-size:21px;line-height:1.1;filter:grayscale(.7)}
.tabbar button[aria-selected=true]{color:var(--ink);background:var(--soft)}
.tabbar button[aria-selected=true] .ti{filter:none}

.tabbar button .ti.ti-bulb{filter:none}
.tabbar button .ti.ti-pig{display:grid;place-items:center;height:26px}
.tabbar button .ti{display:grid;place-items:center;height:26px;width:100%}
.tabbar button{justify-content:flex-start}
.badge{position:absolute;top:2px;right:calc(50% - 24px);background:var(--hot);color:#fff;font-family:var(--f-mono);font-size:10.5px;border-radius:99px;padding:1px 5px;min-width:18px}

/* ---------- Sheet & toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h2{margin-top:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.notice{font-size:13px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--tag) 30%,var(--surface));margin-top:12px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
/* ===== Responsive / touch: phones from 320px up to tablets ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,[role=tab],.chip,input,select,textarea{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
/* iOS zooms into inputs under 16px: keep them at 16px on touch screens */
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}
/* Cart: on narrow phones the supermarket buttons wrap instead of overflowing */
@media (max-width:420px){
  .cl2{flex-wrap:wrap;row-gap:6px}

}
@media (max-width:360px){
  
  .tabbar button{font-size:9px!important}

}

@media (max-width:420px){
  .cprow{grid-template-columns:minmax(0,1fr) auto}
  .cprow>span:first-child{grid-column:1 / -1;font-size:12px!important}

.scrim.mid .sheet{max-height:calc(100% - 24px);overflow:auto}
.le-sheet{animation:none}

/* Start screen: just the icon on a full-screen yellow background, on every device */
#splash{position:fixed;will-change:opacity;top:calc(-1*env(safe-area-inset-top,0px));left:calc(-1*env(safe-area-inset-left,0px));right:calc(-1*env(safe-area-inset-right,0px));bottom:calc(-1*env(safe-area-inset-bottom,0px));min-height:100lvh;z-index:999;background:radial-gradient(circle at 50% 45%,#FFE57A,#FFC21F 80%);display:grid;place-items:center;transition:opacity .5s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .sp-in{animation:spIn .6s cubic-bezier(.2,.9,.3,1.3) both}
#splash .sp-ico{width:clamp(120px,40vmin,240px);aspect-ratio:1;border-radius:22%;overflow:hidden;box-shadow:0 18px 40px rgba(120,80,0,.28)}
#splash .sp-ico svg{width:100%;height:100%;display:block}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:16px}
#splash .sp-ver{font-family:var(--f-mono);font-size:11px;font-style:italic;font-weight:600;color:#183A27;opacity:.65;min-height:1em}
@keyframes spIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}

.cf-a{color:#1E5AA8}.cf-b{color:#D2372E}

/* Back-to-top button (Artículos) */
#to-top{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:48px;height:48px;border-radius:15px;border:2.5px solid var(--ink);background:var(--tag);color:var(--basket);display:grid;place-items:center;box-shadow:3px 4px 0 var(--ink);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:opacity .2s ease,transform .2s ease,box-shadow .12s ease}#to-top:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
#to-top[hidden]{display:grid!important;opacity:0;transform:translateY(12px);pointer-events:none}
</style>

  <button role="tab" data-tab="ahorro" aria-selected="false"><span class="ti ti-bulb ti-pig"><svg viewBox="0 0 40 32" width="30" height="24" aria-hidden="true" style="display:block"><circle cx="21" cy="5" r="4.2" fill="#FFC21F" stroke="#B8860B" stroke-width="1.3"/><path d="M19.6 5h2.8" stroke="#B8860B" stroke-width="1.3" stroke-linecap="round"/><path d="M10 13 L8 7.5 L14.5 10.5 Z" fill="#F48FB1" stroke="#C2185B" stroke-width="1.4" stroke-linejoin="round"/><ellipse cx="19" cy="18.5" rx="14" ry="10" fill="#F8A5C2" stroke="#C2185B" stroke-width="1.6"/><rect x="9" y="25" width="4" height="5" rx="1.5" fill="#F48FB1" stroke="#C2185B" stroke-width="1.4"/><rect x="23" y="25" width="4" height="5" rx="1.5" fill="#F48FB1" stroke="#C2185B" stroke-width="1.4"/><ellipse cx="33.5" cy="19" rx="4" ry="4.4" fill="#F48FB1" stroke="#C2185B" stroke-width="1.5"/><circle cx="32.3" cy="18.6" r=".9" fill="#C2185B"/><circle cx="34.8" cy="18.6" r=".9" fill="#C2185B"/><circle cx="27" cy="14.5" r="1.4" fill="#3a1f2b"/><path d="M16 10.4h7" stroke="#C2185B" stroke-width="2" stroke-linecap="round"/><path d="M5 17 q-3 -1 -2.5 2.5 q.5 2.5 3 1" fill="none" stroke="#C2185B" stroke-width="1.4" stroke-linecap="round"/><ellipse cx="14" cy="16" rx="4" ry="2.2" fill="#fff" opacity=".45"/></svg></span>Ahorro</button>

<button type="button" id="to-top" aria-label="Volver arriba" hidden><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12.5l6-6 6 6"/><path d="M6 19l6-6 6 6" opacity=".45"/></svg></button>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= Data model =================
   supers/{id}     {name, color}
   products/{id}   {name, dept, super, price, history:[{price,date}], updatedAt}
   cart/current    {items:{productId: qty}}
   purchases/{id}  {month:"YYYY-MM", date:"YYYY-MM-DD", super, total, source, items:[{name, dept, qty, price}]}
   settings/main   {budget}
*/
const DEPTS=[
  {id:'alimentacion',name:'Alimentación',icon:'🥫',c:'#E39B2D'},
  {id:'fruteria',name:'Frutería',icon:'🍎',c:'#3E9B4F'},
  {id:'carniceria',name:'Carnicería',icon:'🥩',c:'#D2504A'},
  {id:'pescaderia',name:'Pescadería',icon:'🐟',c:'#1F9C9C'},
  {id:'congelados',name:'Congelados',icon:'🧊',c:'#3B8FD0'},
  {id:'quesos',name:'Chacinas y quesos',icon:'🧀',c:'#D9A21B'},
  {id:'snacks',name:'Patatas y snacks',icon:'🍿',c:'#E0677F'},
  {id:'frutossecos',name:'Frutos secos',icon:'🥜',c:'#9A6B3F'},
  {id:'drogueria',name:'Droguería',icon:'🧴',c:'#7B61C9'},
  {id:'higiene',name:'Higiene',icon:'🧻',c:'#C2185B'},
  {id:'panaderia',name:'Panadería',icon:'🥖',c:'#C68A3A'},
];
const DEPT=Object.fromEntries(DEPTS.map(d=>[d.id,d]));
const DEPTS_AZ=()=>[...DEPTS].sort((a,b)=>a.name.localeCompare(b.name,'es'));
const DEFAULT_SUPERS=[{id:'aldi',name:'Aldi',color:'#1E5AA8'},{id:'mercadona',name:'Mercadona',color:'#1F8A4C'},{id:'carrefour',name:'Carrefour',color:'#D2372E'}];

if(/netlify\.app$/.test(location.hostname))document.documentElement.classList.add('nlb');
const S={keep:{},gastos:{},gOff:0,gCat:'farmacia',faltaTop:(()=>{try{return localStorage.getItem('cesta-falta-top')==='1'}catch(_){return false}})(),picked:{},lista:{},supers:{},products:{},cart:{},purchases:{},settings:{},tab:'frecuentes',loaded:false};
let db=null, mode='loading';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'});
const money=n=>eur.format(Math.round((+n||0)*100)/100);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80)||('x'+Date.now());
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const monthKey=(off=0)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const monthName=k=>{const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'})};
const parseNum=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const superOf=id=>S.supers[id]||{name:id||'Sin súper',color:'#8A958D'};

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400)}
function bump(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}

/* ================= Storage (shared db, or this browser as fallback) ================= */
const LS='cesta-molona-local-v1';
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j){Object.assign(S,{supers:j.supers||{},products:j.products||{},cart:j.cart||{},picked:j.picked||{},keep:j.keep||{},purchases:j.purchases||{},settings:j.settings||{},lista:j.lista||{},gastos:j.gastos||{}})}}catch(e){}
  if(!Object.keys(S.supers).length) DEFAULT_SUPERS.forEach(s=>S.supers[s.id]={name:s.name,color:s.color});}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({supers:S.supers,products:S.products,cart:S.cart,picked:S.picked,keep:S.keep,purchases:S.purchases,settings:S.settings,lista:S.lista,gastos:S.gastos}))}catch(e){}}

function writeFail(e){console.warn(e);toast(e&&e.code==='quota_exceeded'?'No queda espacio: borra compras antiguas':'No se pudo guardar. Prueba otra vez')}
const store={
  async saveProduct(id,p){S.products[id]=p;if(db){await db.doc('products/'+id).set(p).catch(writeFail)}else saveLocal();render()},
  async deleteProduct(id){delete S.products[id];if(S.cart[id]){delete S.cart[id];store.saveCart()}if(db){await db.doc('products/'+id).delete().catch(writeFail)}else saveLocal();render()},
  async saveSuper(id,s){S.supers[id]=s;if(db){await db.doc('supers/'+id).set(s).catch(writeFail)}else saveLocal();render()},
  async deleteSuper(id){delete S.supers[id];if(db){await db.doc('supers/'+id).delete().catch(writeFail)}else saveLocal();render()},
  async addPurchase(p){const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);S.purchases[id]=p;if(db){await db.doc('purchases/'+id).set(p).catch(writeFail)}else saveLocal();render()},
  async savePurchase(id,p){S.purchases[id]=p;if(db){await db.doc('purchases/'+id).set(p).catch(writeFail)}else saveLocal();render()},
  async deletePurchase(id){delete S.purchases[id];if(db){await db.doc('purchases/'+id).delete().catch(writeFail)}else saveLocal();render()},
  async saveGasto(id,g){S.gastos[id]=g;if(db){await db.doc('gastos/'+id).set(g).catch(writeFail)}else saveLocal();render()},
  async deleteGasto(id){delete S.gastos[id];if(db){await db.doc('gastos/'+id).delete().catch(writeFail)}else saveLocal();render()},
  async saveLista(id,d){S.lista[id]=d;render();if(db){await db.doc('lista/'+id).set(d).catch(writeFail)}else saveLocal()},
  async deleteLista(id){delete S.lista[id];if(db){await db.doc('lista/'+id).delete().catch(writeFail)}else saveLocal();render()},
  async saveSettings(s){S.settings=s;if(db){await db.doc('settings/main').set(s).catch(writeFail)}else saveLocal();render()},
  _cartTimer:null,_cartBusy:false,cartDirty:false,
  saveCart(){store.cartDirty=true;if(!db){saveLocal();store.cartDirty=false;return}
    clearTimeout(store._cartTimer);store._cartTimer=setTimeout(store._flushCart,700)},
  async _flushCart(){if(store._cartBusy){store._cartTimer=setTimeout(store._flushCart,400);return}
    store._cartBusy=true;try{await db.doc('cart/current').set({items:{...S.cart},picked:{...S.picked},keep:{...S.keep}})}catch(e){writeFail(e)}store._cartBusy=false;store.cartDirty=false}
};

const _got=new Set();
function afterLoad(){if(['products','lista','settings','cart'].every(k=>_got.has(k))){syncCartSoon()}}
/* One single list: delete every saved article that is not in Artículos (runs once) */

function subColl(name,key){
  db.collection(name).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S[key]=o;S.loaded=true;render();_got.add(key);afterLoad()},e=>console.warn(name,e));
}
async function boot(){
  render();
  try{ if(window.claude&&claude.use) db=await claude.use('db'); }catch(e){db=null}
  if(db){
    mode='db';
    subColl('supers','supers');subColl('products','products');subColl('purchases','purchases');subColl('lista','lista');subColl('gastos','gastos');
    db.doc('cart/current').onSnapshot(d=>{if(!store.cartDirty){S.cart={...(d.exists?(d.data().items||{}):{})};S.picked={...(d.exists?(d.data().picked||{}):{})};S.keep={...(d.exists?(d.data().keep||{}):{})};render()}_got.add('cart');afterLoad()},e=>console.warn(e));
    db.doc('settings/main').onSnapshot(d=>{S.settings=d.exists?{...d.data()}:{};render();_got.add('settings');afterLoad()},e=>console.warn(e));
  }else{
    mode='local';loadLocal();S.loaded=true;render();setTimeout(syncCartSoon,300);
  }
}

/* ================= Derived ================= */
function cartLines(){return Object.entries(S.cart).filter(([id,q])=>q>0&&S.products[id]).map(([id,q])=>({id,q,p:S.products[id]}))}
function cartTotal(){return cartLines().reduce((a,l)=>a+l.q*(+l.p.price||0),0)}
/* Spending cycle: from day N of one month to day N-1 of the next (settings.cycleDay, default 27) */
const cycleDay=()=>{const n=Math.round(+S.settings.cycleDay);return n>=1&&n<=31?n:27};
const isoOf=dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const cStart=(y,m0)=>{const dim=new Date(y,m0+1,0).getDate();return new Date(y,m0,Math.min(cycleDay(),dim))};
function cycleStartOf(iso){const [y,m,d]=(iso||today()).split('-').map(Number);const here=cStart(y,m-1);return isoOf(d>=here.getDate()?here:cStart(y,m-2))}
function cycleEndOf(start){const [y,m]=start.split('-').map(Number);const nx=cStart(y,m);nx.setDate(nx.getDate()-1);return isoOf(nx)}
const pDate=p=>p.date||((p.month||today().slice(0,7))+'-15');
function cycleSpent(){const st=cycleStartOf(today());return Object.values(S.purchases).filter(p=>cycleStartOf(pDate(p))===st).reduce((a,p)=>a+(+p.total||0),0)}
const shortD=iso=>new Date(iso+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'}).replace('.','');
function cycleLabel(st){return cycleDay()===1?monthName(st.slice(0,7)):`${shortD(st)} – ${shortD(cycleEndOf(st))}`}

/* ================= Render ================= */
let lastTotals={};
function render(){
  _G=null;_LM={};
  renderHeader();
  if(S.tab==='frecuentes')renderLista();
  if(S.tab==='ahorro')renderReco();
  if(S.tab==='compras')renderCompras();
  if(S.tab==='gastos')renderGastos();
  const nf=Object.values(S.lista).filter(x=>x.falta).length;const fb=$('#falta-badge');fb.hidden=!nf;fb.textContent=nf;
}
function renderHeader(){
  const spent=cycleSpent(),cart=cartTotal();
  $('#tk-date').textContent=new Date().toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
  $('#lbl-month').textContent=cycleDay()===1?'Gastado en '+new Date().toLocaleDateString('es-ES',{month:'short'}).replace('.',''):'Gastado desde '+shortD(cycleStartOf(today()));
  const set=(id,v)=>{const el=$(id);const t=money(v);if(el.textContent!==t){el.textContent=t;if(lastTotals[id]!==undefined)bump(el)}lastTotals[id]=t};
  set('#t-month',spent);set('#t-proj',cart);
}
/* Name of a supermarket as shown on screen: Carrefour in two colours ("Carre" blue, "four" red) */
function superName(id,plain){const s=superOf(id);if(norm(s.name)==='carrefour')return '<span class="cf"><span class="cf-a">Carre</span><span class="cf-b">four</span></span>';return plain?esc(s.name):`<span style="color:${esc(s.color)}">${esc(s.name)}</span>`}
function superText(id){return `<span class="stxt">${superName(id)}</span>`}
function superChip(id){const s=superOf(id);return `<span class="dot" style="background:${esc(s.color)};margin-right:6px"></span>${superName(id,true)}`}

/* One card for the same article in several supermarkets: cheapest first */

function groupIds(k){return Object.entries(S.products).filter(([,p])=>gKey(p.name)===k)}

function cycleShift(off){const [y,m]=cycleStartOf(today()).split('-').map(Number);return isoOf(cStart(y,m-1+off))}
const TIPOS=DEPTS.map(d=>({id:d.id,name:d.name,icon:d.icon,c:d.c||'#8A958D'}));
const TIPO=Object.fromEntries(TIPOS.map(t=>[t.id,t]));
const tipoOfDept=d=>DEPT[d]?d:'alimentacion';
function tipoOfProduct(p){const k=gKey(p.name);
  const li=Object.values(S.lista).find(x=>{if(!x.dept)return false;if(gKey(x.name)===k)return true;const m=matchLista(x);return m&&!m.fuzzy&&m.k===k});
  return tipoOfDept(li?li.dept:p.dept)}
const tipoOfItem=i=>tipoOfDept(i.dept);
function tipoOfPurchase(p){if(p.dept)return tipoOfDept(p.dept);const n=norm(p.notes||'');
  if(/higiene/.test(n))return 'higiene';if(/drogu|limpieza/.test(n))return 'drogueria';
  if(/fruter|fruta/.test(n))return 'fruteria';if(/congel/.test(n))return 'congelados';if(/chacin|queso|embutid/.test(n))return 'quesos';if(/refrig/.test(n))return 'refrigerados';if(/snack|patatas/.test(n))return 'snacks';if(/frutos secos/.test(n))return 'frutossecos';if(/pescad|pescado/.test(n))return 'pescaderia';if(/carni|carne/.test(n))return 'carniceria';return 'alimentacion'}
const tipoOptions=sel=>TIPOS.map(t=>`<option value="${t.id}"${tipoOfDept(sel||'alimentacion')===t.id?' selected':''}>${t.icon} ${t.name}</option>`).join('');

function comprasPorTipo(){
  const off=S.cpOff||0;const st=off==null?null:cycleShift(off);
  const list=Object.values(S.purchases).filter(p=>S.cpAll||cycleStartOf(pDate(p))===st);
  const by={};const add=(k,v)=>{if(v>0.004)by[k]=(by[k]||0)+v};
  list.forEach(p=>{const its=p.items||[];let sum=0;
    its.forEach(i=>{const v=(+i.qty||1)*(+i.price||0);sum+=v;add(tipoOfItem(i),v)});
    add(tipoOfPurchase(p),(+p.total||0)-sum)});
  TIPOS.forEach(t=>{if(!by[t.id])by[t.id]=0});
  const tot=Object.values(by).reduce((a,b)=>a+b,0);const max=Math.max(1,...Object.values(by));
  const nav=`<div style="text-align:center;margin:12px 0 8px"><b style="font-size:17px">${S.cpAll?'Todas las compras':esc(cycleLabel(st))}</b></div>`;
  if(!tot)return nav+`<div class="empty"><div class="big">Sin compras en este ciclo</div><p>Pulsa «Ciclos anteriores» para ver otros ciclos.</p></div>`;
  return nav+`<div class="card"><div class="subtotal" style="padding-top:0"><span>Total</span><span>${money(tot)}</span></div><div class="bars" style="margin-top:10px">${Object.entries(by).sort((a,b)=>b[1]-a[1]||TIPOS.findIndex(t=>t.id===a[0])-TIPOS.findIndex(t=>t.id===b[0])).map(([k,v])=>`<div class="bar"><span>${TIPO[k].icon} ${TIPO[k].name}</span><div class="track"><div class="fill" style="width:${v/max*100}%;background:${TIPO[k].c}"></div></div><span>${money(v)} <span class="muted">${Math.round(v/tot*100)}%</span></span></div>`).join('')}</div>
</div>`}
/* ================= Otros gastos (farmacia, estanco, gasolina, otros) ================= */
const GCATS=[{id:'farmacia',name:'Farmacia',icon:'💊',c:'#2E9E6B'},{id:'estanco',name:'Tirititrán',icon:'<svg class="emo" viewBox="0 0 32 24" width="1.25em" height="1em" aria-hidden="true"><rect x="13" y="4" width="17" height="7" rx="2" fill="#9AA5B1"/><circle cx="11" cy="13" r="9" fill="#C3CCD5" stroke="#6B7785" stroke-width="1.6"/><circle cx="11" cy="13" r="3.2" fill="#6B7785"/><rect x="26" y="4" width="4" height="7" rx="1.5" fill="#6B7785"/><path d="M15 6h9" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".7"/></svg>',c:'#8A6D3B'},{id:'gasolina',name:'Gasolina',icon:'⛽',c:'#D2504A'},{id:'otros',name:'Otros',icon:'🧩',c:'#5B6B9A'}];
const GCAT=Object.fromEntries(GCATS.map(c=>[c.id,c]));
function renderGastos(){
  if(!$('#g-date').value)$('#g-date').value=today();
  $('#g-cats').innerHTML=GCATS.map(c=>`<button type="button" class="gcat" role="radio" aria-checked="${S.gCat===c.id}" data-gcat="${c.id}"><span>${c.icon}</span>${c.name}</button>`).join('');
  const off=S.gOff||0;const st=cycleShift(off);const all=Object.entries(S.gastos).filter(([,g])=>S.gAll&&S.gView==='graf'||cycleStartOf(g.date)===st).sort((a,b)=>(b[1].date||'').localeCompare(a[1].date||''));
  const tot=all.reduce((a,[,g])=>a+(+g.amount||0),0);const by={};all.forEach(([,g])=>{by[g.cat]=(by[g.cat]||0)+(+g.amount||0)});
  const fd=d=>new Date(d+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'}).replace('.','');
  const graf=S.gView==='graf';
  const bar=`<div class="li-sticky gbar-wrap" style="top:${Math.max(0,($('.ticket')?.offsetHeight||0)-4)}px;z-index:19"><div class="gbar"><button class="chip" data-gview="fecha" aria-pressed="${!graf}">Por fecha</button><button class="chip" data-gview="graf" aria-pressed="${graf}">Por tipo</button>
    <span class="gnav"><button class="chip" data-goff="${off-1}" aria-label="Mes anterior" ${graf&&S.gAll?'disabled':''}><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></button><span class="gmes" title="${esc(cycleLabel(st))}">Mes</span><button class="chip" data-goff="${off+1}" aria-label="Mes siguiente" ${off>=0||graf&&S.gAll?'disabled':''}><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg></button></span>
    <span class="gtot" title="${S.gAll&&graf?'Total de todos los gastos':esc(cycleLabel(st))}">${money(tot)}</span></div></div>
    ${graf?`<div class="row" style="justify-content:center;margin-top:8px"><button class="chip" data-gall="1" aria-pressed="${!!S.gAll}">Ver todo junto</button></div>`:''}`;
  if(graf){const max=Math.max(1,...GCATS.map(c=>by[c.id]||0));const bud=S.gAll?{}:(S.settings.gBudget||{});const hasB=GCATS.some(c=>bud[c.id]>0);
    const btot=GCATS.reduce((a,c)=>a+(+bud[c.id]||0),0);
    const left=(v,B)=>v<=B?`<span class="gb-left ok">Quedan ${money(B-v)}</span>`:`<span class="gb-left over">Te pasas ${money(v-B)}</span>`;
    const rows=[...GCATS].sort((a,b)=>(by[b.id]||0)-(by[a.id]||0)).map(c=>{const v=by[c.id]||0;const B=+bud[c.id]||0;
      if(B>0){const pct=Math.min(100,v/B*100);return `<div class="gb-row"><div class="gb-top"><span>${c.icon} ${c.name}</span><span class="mono"><b>${money(v)}</b> <span class="muted">de ${money(B)}</span></span></div><div class="gb-track"><div class="fill" style="width:${pct}%;background:${v>B?'var(--danger,#D2372E)':c.c}"></div></div>${left(v,B)}</div>`}
      return `<div class="gb-row"><div class="gb-top"><span>${c.icon} ${c.name}</span><span class="mono"><b>${money(v)}</b> <span class="muted">${tot?Math.round(v/tot*100):0}%</span></span></div><div class="gb-track"><div class="fill" style="width:${v/max*100}%;background:${c.c}"></div></div>${S.gAll?'':'<span class="gb-left muted">Sin presupuesto</span>'}</div>`}).join('');
    $('#gastos').innerHTML=bar+`<div style="text-align:center;margin:12px 0 8px"><b style="font-size:17px">${S.gAll?'Todos los gastos':esc(cycleLabel(st))}</b></div>

function setQty(id,q){q=Math.max(0,Math.min(99,q));if(q)S.cart[id]=q;else{delete S.cart[id];delete S.picked[id];delete S.keep[id];unmarkProduct(id)}store.saveCart();render()}
/* ---------- Same / similar article detection ---------- */
const STOP=new Set(['de','del','la','el','los','las','con','sin','en','y','para','al','a','e','u']);
const UNIT={l:'l',lt:'l',lts:'l',litro:'l',litros:'l',ml:'ml',cl:'cl',g:'g',gr:'g',grs:'g',gramo:'g',gramos:'g',kg:'kg',kilo:'kg',kilos:'kg',ud:'u',uds:'u',unidad:'u',unidades:'u'};
function toks(s){return norm(s).replace(/(\d),(\d)/g,'$1.$2').replace(/(\d+(?:\.\d+)?)\s*(litros?|lts?|ml|cl|gramos?|grs?|g|kilos?|kg|l|unidades|unidad|uds?)\b/g,(m,n,u)=>' '+n+UNIT[u]+' ')
  .replace(/[^a-z0-9.]+/g,' ').split(' ').map(t=>t.replace(/^\.+|\.+$/g,'')).filter(t=>t&&!STOP.has(t))}
/* Identity: same words in any order, ignoring case, accents, punctuation and "1L" vs "1 litro" */
const idKey=s=>[...new Set(toks(s))].sort().join(' ');
/* Same article for grouping and comparing: also ignores singular/plural (galleta/galletas, tomate/tomates) */
const sing=t=>/\d/.test(t)?t:(t.length>4&&/[lnrdz]es$/.test(t))?t.slice(0,-2):(t.length>3&&t.endsWith('s'))?t.slice(0,-1):t;
const qn=t=>{const m=/^(?:x(\d+)|(\d+)x)$/.exec(t);return m?'x'+(m[1]||m[2]):t}; // "2x" and "x2" are the same
const gKey=s=>[...new Set(toks(s).map(qn).map(sing))].sort().join(' ');
function findProduct(name,superId){const k=idKey(name);
  const hits=Object.entries(S.products).filter(([,p])=>idKey(p.name)===k||(p.aliases||[]).includes(k));
  return hits.find(([,p])=>p.super===superId)||null}
/* Use the name already in the shop when it is the same article (also from other supermarkets) */
function canonName(name,superId){const k=idKey(name);
  const hits=Object.values(S.products).filter(p=>idKey(p.name)===k||(p.aliases||[]).includes(k));
  const p=hits.find(p=>p.super===superId)||hits[0];return p?p.name:String(name).trim()}
/* For each new row, the closest existing article (or earlier row) that is similar but not identical */
/* Full pipeline: canonical names → ask about similar ones → apply answers. Returns rows or null if cancelled */
/* Lines with the same article and price in one ticket become one line with more units */

async function upsertProduct({name,dept,superId,price,manual=true}){
  name=String(name).trim();if(!name)return;
  const ex=findProduct(name,superId);
  const id=ex?ex[0]:slug(superId+'-'+name);const old=ex?ex[1]:(S.products[id]||null);
  const hist=[...(old?.history||[])];const pr=Math.round(parseNum(price)*100)/100;
  if(!old||+old.price!==pr)hist.push({price:pr,date:today()});
  const np={...(old||{}),name:old?old.name:name,dept:dept||old?.dept||'alimentacion',super:superId,price:pr,history:hist.slice(-12),updatedAt:today()};
  delete np.fuente;delete np.detalle; // a real price replaces the web estimate
  if(manual)np.verificado=true;else delete np.verificado; // ✓ = price checked by hand
  await store.saveProduct(id,np);
  return id;
}

function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
/* Same word allowing plurals and one typo (espaguetti / espaguetis), never just a shared fragment */
function tokMatch(a,b){if(a===b)return true;const sa=a.replace(/(es|s)$/,''),sb=b.replace(/(es|s)$/,'');if(sa===sb)return true;
  return a.length>=8&&b.length>=8&&lev(a,b)<=1}
function closeMatch(listName,prodName){const L=toks(listName).filter(t=>!/^\d/.test(t)&&!['o','x'].includes(t)),P=toks(prodName);
  if(!L.length||!P.length||!tokMatch(L[0],P[0]))return -1;
  if(!L.every(t=>P.some(p=>tokMatch(t,p))))return -1;return P.length-L.length}

function recoNeeds(src){
  const m={};const add=(k,name,dept,qty,cur)=>{const e=m[k]=m[k]||{k,name,dept,qty:0,cur:null,curVotes:{}};e.qty+=qty;if(cur){e.curVotes[cur.super]=(e.curVotes[cur.super]||0)+qty;if(!e.cur||e.curVotes[cur.super]>=e.curVotes[e.cur.super])e.cur=cur}};
  if(src==='falta'){Object.values(S.lista).filter(x=>x.falta).forEach(x=>{let mt=matchLista(x);if(mt&&mt.fuzzy)mt=null;const name=mt?mt.name:x.name;add(mt?mt.k:gKey(name),name,mt?mt.dept:'alimentacion',1,null)})}
  else if(src==='cesta'){cartLines().forEach(l=>add(gKey(l.p.name),l.p.name,l.p.dept,l.q,{super:l.p.super,price:+l.p.price}))}
  else{const from=monthKey(-2);const ps=Object.values(S.purchases).filter(p=>(p.month||'')>=from);const months=new Set(ps.map(p=>p.month)).size||1;
    ps.forEach(p=>(p.items||[]).forEach(i=>{const name=canonName(i.name,p.super);add(gKey(name),name,i.dept,(+i.qty||1)/months,{super:p.super,price:+i.price||0})}));
    Object.values(m).forEach(e=>e.qty=Math.max(1,Math.round(e.qty)))}
  return Object.values(m);
}

    for(const [s,v] of Object.entries(by))if((!allowed||allowed.includes(s))&&(!opt||v.price<opt.price-0.0001))opt={super:s,...v};
    let out=false;if(!opt){opt=cheapest(by);out=true;if(!opt&&n.cur)opt={super:n.cur.super,price:n.cur.price,id:null}}

}

  for(const k of ks.slice(1)){if(rec.total-bestByK[k].total>=tripMin){why=`Ir a ${k} súpers te ahorra ${money(rec.total-bestByK[k].total)} frente a ${rec.supers.length===1?'comprarlo todo en uno':'ir a '+rec.supers.length}.`;rec=bestByK[k]}}
  if(!why){const cheaper=ks.slice(1).map(k=>bestByK[k]).filter(p=>p.total<rec.total-0.004).sort((x,y)=>x.total-y.total)[0];
    why=cheaper?`Repartir más la compra solo te ahorraría ${money(rec.total-cheaper.total)}, menos de los ${money(tripMin)} que te compensan el viaje.`:(rec.supers.length===1?'Es la opción más barata y además vas a un solo sitio.':'Es la combinación más barata con los precios que tengo.')}
  rec={...rec,label:rec.supers.map(s=>superOf(s).name).join(' + ')};
  const curTotal=needs.reduce((a,n)=>a+(n.cur?n.cur.price*n.qty:0),0);
  const saveVsCur=curTotal-rec.total;
  lastReco=rec;
  const by={};rec.lines.forEach(l=>(by[l.at.super]=by[l.at.super]||[]).push(l));
  const alt=l=>{const others=Object.entries(G[l.k]?.by||{}).filter(([s])=>s!==l.at.super);if(!others.length)return'<span class="muted" style="font-size:12px">Solo lo tengo en este súper</span>';
    others.sort((a,b)=>a[1].price-b[1].price);const cheap=others[0];
    if(cheap[1].price<l.at.price-0.004)return `<span class="muted" style="font-size:12px">En ${esc(superOf(cheap[0]).name)} sale ${money((l.at.price-cheap[1].price)*l.qty)} más barato, pero no compensa ir solo por esto</span>`;
    const worst=others[others.length-1];const d=worst[1].price-l.at.price;
    return d>0.004?`<span class="save">${money(d*l.qty)} menos que en ${esc(superOf(worst[0]).name)}</span>`:`<span class="muted" style="font-size:12px">Mismo precio en ${esc(superOf(worst[0]).name)}</span>`};
  const opts=plans.slice(0,6);
  const maxT=Math.max(...opts.map(o=>o.total),0.01);
  const noCmp=needs.filter(n=>Object.keys(G[n.k]?.by||{}).length<2).sort((a,b)=>Object.keys(G[b.k]?.by||{}).length-Object.keys(G[a.k]?.by||{}).length||a.name.localeCompare(b.name,'es'));
  el.innerHTML=`
    <div class="hero-reco">
      <div class="hr-top"><span class="hr-lab">Compra recomendada en</span>${saveVsCur>0.009?`<span class="stamp">−${money(saveVsCur)}</span>`:''}</div>
      <div class="where">${esc(rec.label)}</div>
      <p>Pagarías <b>${money(rec.total)}</b>${curTotal>0?(saveVsCur>0.009?`, <b>${money(saveVsCur)} menos</b> que ${S.recoSrc==='cesta'?'con lo que tienes marcado':'donde la sueles hacer'} (${money(curTotal)})`:` y es lo mismo que ${S.recoSrc==='cesta'?'lo que tienes marcado':'donde la sueles hacer'}: ya compras bien`):''}${S.recoSrc==='habitual'?' al mes':''}. ${esc(why)}</p>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn yellow" id="reco-apply">${S.recoSrc==='cesta'?'Cambiar a esta compra':S.recoSrc==='falta'?'Pasar lo que falta a la cesta':'Llenar la cesta con esta compra'}</button></div>

    <h3>Qué comprar en cada sitio</h3>
    <div class="stack">${Object.entries(by).map(([sid,ls])=>`<div class="card"><div class="group-h" style="margin-top:0">${superChip(sid)}<span class="count">${money(ls.reduce((a,l)=>a+l.at.price*l.qty,0))}</span></div>
      ${ls.sort((a,b)=>a.name.localeCompare(b.name,'es')).map(l=>`<div class="plan-line"><div><div class="name">${esc(l.name)}${l.qty>1?` <span class="muted mono">× ${l.qty}</span>`:''}</div>${alt(l)}</div><span class="mono" style="font-weight:700">${money(l.at.price*l.qty)}</span></div>`).join('')}</div>`).join('')}</div>

    <h3>Todas las opciones</h3>
    <div class="card">${opts.map(o=>`<div class="opt${o.supers.slice().sort().join('|')===rec.supers.slice().sort().join('|')?' rec':''}"><span><b>${esc(o.label)}</b>${o.supers.length>1?` <small>· ${o.supers.length} súpers</small>`:''}</span><span class="mono" style="font-weight:700">${money(o.total)}</span><div class="track"><div class="fill" style="width:${o.total/maxT*100}%"></div></div></div>`).join('')}</div>
    <div class="row" style="margin-top:10px"><label for="trip-min" class="muted" style="font-size:13px">Me compensa ir a otro súper si ahorro al menos</label>
      <select id="trip-min" style="width:auto">${[1,2,3,5,8,10,15].map(v=>`<option value="${v}"${v===tripMin?' selected':''}>${money(v)}</option>`).join('')}</select></div>

    ${noCmp.length?`<h3>Sin precios para comparar (${noCmp.length})</h3><div class="card"><p class="muted" style="margin:0 0 8px">Estos artículos no tienen precio en varios supermercados. Pulsa ⚖️ y añade su precio en otro para afinar la recomendación.</p>
      ${noCmp.map(n=>{const any=Object.values(G[n.k]?.by||{})[0];return `<div class="plan-line"><span>${esc(n.name)}</span>${any?`<button class="cmp" data-cmp="${esc(any.id)}">⚖️ Comparar</button>`:'<span class="muted" style="font-size:12px">Sin precio</span>'}</div>`}).join('')}</div>`:''}
    ${nComparable<3?`<div class="notice">Cuantos más tickets de supermercados distintos subas, mejor será la recomendación. Ahora tengo ${nComparable} artículo(s) con precio en varios sitios.</div>`:''}`;
}
function applyReco(){if(!lastReco)return;
  if(S.recoSrc==='cesta'){const keep={};cartLines().forEach(l=>{const k=gKey(l.p.name);const line=lastReco.lines.find(x=>x.k===k);const nid=line?.at?.id||l.id;keep[nid]=(keep[nid]||0)+l.q});S.cart=keep}
  else{if(S.recoSrc!=='falta')S.cart={};lastReco.lines.forEach(l=>{if(l.at.id)S.cart[l.at.id]=Math.max(S.cart[l.at.id]||0,l.qty)})}
  store.saveCart();render();toast('Cesta actualizada con la compra recomendada');
}

/* ================= Confetti ================= */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti');c.hidden=false;const ctx=c.getContext('2d');const W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=['#FFD23F','#14824A','#E2452B','#3B8FD0','#E0677F'];
  const ps=Array.from({length:110},()=>({x:W/2,y:H*0.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*6+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let f=0;(function tick(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});
    if(++f<110)requestAnimationFrame(tick);else{ctx.clearRect(0,0,W,H);c.hidden=true}})();
}

/* Shows unexpected errors on screen (tap the red box to close it) */
function diag(m){let d=document.getElementById('diag');if(!d){d=document.createElement('div');d.id='diag';d.style.cssText='position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:100000;background:#b00020;color:#fff;font:12px/1.35 ui-monospace,monospace;padding:8px 10px;border-radius:10px;white-space:pre-wrap;max-height:40vh;overflow:auto';d.onclick=()=>d.remove();document.body.appendChild(d)}d.textContent+=m+'\n'}
window.addEventListener('error',e=>diag('Error: '+e.message+' · línea '+(e.lineno||'?')));
window.addEventListener('unhandledrejection',e=>diag('Error: '+((e.reason&&e.reason.message)||e.reason)));



/* Menu button: the tab bar drops down under the yellow header and closes after choosing a tab */
(function(){const bar=$('#tabbar'),btn=$('#tb-menu');
  const place=()=>{const t=$('.ticket');bar.style.top=Math.round((t?t.getBoundingClientRect().bottom:0)+6)+'px'};
  const set=open=>{if(open)place();document.documentElement.classList.toggle('tb-open',open);btn.setAttribute('aria-expanded',String(open));btn.setAttribute('aria-pressed',String(open))};
  btn.addEventListener('click',e=>{e.stopPropagation();set(!document.documentElement.classList.contains('tb-open'))});
  bar.addEventListener('click',e=>{if(e.target.closest('[data-tab]'))set(false)});
  document.addEventListener('click',e=>{if(document.documentElement.classList.contains('tb-open')&&!e.target.closest('#tabbar,#tb-menu'))set(false)});
  addEventListener('resize',()=>{if(document.documentElement.classList.contains('tb-open'))place()});
  set(false)})();
