<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1446">
<meta name="description" content="Mi chistera de juegos de cartomagia.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Magia Molona">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>La Magia Molona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{
  --night:#0E0B2B;      /* fondo noche */
  --deep:#1B1446;       /* azul tinta */
  --card:#241C5C;       /* tarjetas */
  --card2:#2E2370;
  --line:rgba(190,170,255,.18);
  --ink:#F3EEFF;
  --muted:#B4A8E0;
  --violet:#8B5CF6;
  --violet2:#B794FF;
  --blue:#4F7BFF;
  --cyan:#5EE1FF;
  --gold:#FFD36E;
  --pink:#FF7AC8;
  --hot:#FF5D7A;
  --ok:#5BE3A4;
  --f-magic:"Cinzel Decorative",Georgia,serif;
  --f-body:"Fredoka",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:radial-gradient(ellipse 90% 60% at 15% 0%,#3B1F8F 0%,transparent 60%),
             radial-gradient(ellipse 80% 60% at 100% 30%,#1E3A9E 0%,transparent 60%),
             radial-gradient(ellipse 90% 70% at 50% 110%,#4A1A7A 0%,transparent 60%),var(--night)}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 130px}

/* ---------- Cabecera ---------- */
header.top{position:sticky;top:0;z-index:20;margin:0 -16px;padding:14px 16px 12px;
  background:linear-gradient(180deg,rgba(14,11,43,.97),rgba(14,11,43,.85));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:10px}
.hat{width:42px;height:42px;flex:none;filter:drop-shadow(0 0 10px rgba(183,148,255,.55))}
.brand{font-family:var(--f-magic);font-weight:900;font-size:22px;line-height:1.05;letter-spacing:.01em;
  background:linear-gradient(90deg,#fff 0%,var(--violet2) 45%,var(--cyan) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.iconbtn{margin-left:auto;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:20px}

/* ---------- Buscador y chips ---------- */
.search{margin-top:12px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:16px;padding:0 12px}
.search input{flex:1;background:none;border:0;outline:0;padding:11px 0;font-size:16px}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:14px;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--violet),var(--blue));border-color:transparent;box-shadow:0 4px 16px -6px var(--violet)}
.chips.wrapc{flex-wrap:wrap;overflow:visible}

/* ---------- Tarjetas de juego ---------- */
.list{display:grid;gap:12px;margin-top:10px}
.trick{position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border-radius:20px;
  background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s}
.trick:active{transform:scale(.985)}
.trick .emo{flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:26px;background:rgba(255,255,255,.08)}
.trick .body{flex:1;min-width:0}
.trick h3{margin:0;font-size:17.5px;font-weight:600;line-height:1.2;padding-right:28px}
.trick p{margin:4px 0 0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trick .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.trick .fav{position:absolute;top:10px;right:12px;font-size:18px}
.trick .suit{position:absolute;right:12px;bottom:8px;font-size:15px;opacity:.35}
.trick .suit.r{color:#FF7A9A;opacity:.55}
.tiporow{display:flex;gap:8px;align-items:center;margin-top:8px}
.tiporow .emo-in{width:56px;text-align:center;padding:10px 4px}
.tiporow .nm-in{flex:1}
.pickrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:left;margin-top:8px}
.pickrow .ck{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;border:2px solid var(--violet2)}
.pickrow[aria-pressed="true"] .ck{background:linear-gradient(135deg,var(--violet),var(--blue));border-color:transparent}
.pickrow[aria-pressed="true"] .ck::after{content:"✓";font-weight:700}
.flab{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:5px}
.flab label{margin:0}
.mtools{display:flex;gap:6px}
.mbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.mbtn:active{transform:scale(.92)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.mitem{position:relative;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid var(--line);min-height:70px;display:grid;place-items:center}
.mitem img,.mitem video{display:block;width:100%;height:130px;object-fit:cover;background:#000}
.mitem.aud{grid-column:1/-1;min-height:0;padding:8px}
.mitem audio{width:100%}
.mdel{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(14,11,43,.85);color:#fff;font-size:13px;z-index:2}
.recbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(255,93,122,.15);border:1px solid rgba(255,93,122,.4)}
.recbar .dot{width:12px;height:12px;border-radius:50%;background:var(--hot);animation:blink 1s infinite}
.recbar .btn{margin-left:auto}
@keyframes blink{50%{opacity:.25}}
.imgview{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}
.imgview img{max-width:100%;max-height:100%;border-radius:12px}
.perform .mitem img,.perform .mitem video{height:200px}
#ef .tiporow input{padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:16px}
.list:has(.line){gap:6px}
.line{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:16px}
.line:active{background:rgba(183,148,255,.15)}
.line .li{flex:none;font-size:18px;width:24px;text-align:center}
.line .ln{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.line .lf{flex:none;font-size:14px}
.sheet.full{min-height:88vh}
.sheet.full>.mgrid{margin-top:12px}
.dtools{display:flex;justify-content:center;gap:10px;margin-top:22px;opacity:.85}
.ghban{display:block;margin-top:10px;padding:8px 12px;border-radius:12px;background:rgba(255,211,110,.12);border:1px solid rgba(255,211,110,.35);color:var(--gold);font-size:13px;text-decoration:none}
.ghban b{color:#fff;word-break:break-all}
.formbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.rhead{display:flex;align-items:center;gap:10px;margin-top:14px}
.rhead h2{flex:1;font-family:var(--f-magic);font-size:22px;margin:0;line-height:1.2}
.tag{font-size:12px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--ink);white-space:nowrap}
.tag.lv-aprendiendo{background:rgba(94,225,255,.14);color:var(--cyan)}
.tag.lv-listo{background:rgba(91,227,164,.15);color:var(--ok)}
.tag.lv-estrella{background:rgba(255,211,110,.17);color:var(--gold)}
.wands{letter-spacing:-2px}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:54px;display:block;margin-bottom:8px;animation:float 3s ease-in-out infinite}
.empty h2{font-family:var(--f-magic);color:var(--ink);font-size:20px;margin:0 0 6px}
@keyframes float{50%{transform:translateY(-8px) rotate(-4deg)}}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:16px;font-weight:600;
  background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;box-shadow:0 8px 20px -10px var(--violet)}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);box-shadow:none}
.btn.gold{background:linear-gradient(135deg,#FFD36E,#FF9E5E);color:#2A1500}
.btn.danger{background:rgba(255,93,122,.15);color:var(--hot);border:1px solid rgba(255,93,122,.35);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px}

.fab{position:fixed;right:max(18px,calc(50vw - 362px));bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:35;width:62px;height:62px;border-radius:22px;font-size:30px;color:#fff;
  background:linear-gradient(135deg,var(--pink),var(--violet) 55%,var(--blue));box-shadow:0 12px 28px -8px rgba(139,92,246,.9),0 0 0 4px rgba(14,11,43,.6)}

/* ---------- Pestañas con forma de naipe ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(96px + env(safe-area-inset-bottom,0px));overflow:visible;pointer-events:none;
  background:linear-gradient(180deg,rgba(14,11,43,0) 0%,rgba(14,11,43,.92) 45%,#0E0B2B 100%)}
.tabbar nav{display:flex;justify-content:center;align-items:flex-start;gap:6px;height:100%}
.ctab{pointer-events:auto;position:relative;width:96px;height:132px;border-radius:12px;margin-top:22px;transform:translateY(26px) rotate(var(--r,0deg));
  transition:transform .3s cubic-bezier(.3,1.4,.5,1),box-shadow .3s;
  background:radial-gradient(circle,rgba(255,255,255,.22) 1.6px,transparent 2.2px) 0 0/11px 11px,
    repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 6px,transparent 6px 12px),linear-gradient(140deg,#6A47E0,#2D3DB0);
  border:4px solid #EDE6FF;box-shadow:0 8px 20px -6px rgba(0,0,0,.7);color:#fff}
.ctab:nth-child(1){--r:-7deg}.ctab:nth-child(2){--r:7deg}
.ctab .lbl{position:absolute;left:50%;top:18px;transform:translateX(-50%);font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(14,11,43,.75);white-space:nowrap}
.ctab .ix,.ctab .ix2,.ctab .pip{display:none}
.ctab[aria-selected="true"]{transform:translateY(0) rotate(calc(var(--r,0deg) / 2));background:#FFF8EC;border-color:#fff;color:#1B1446;
  box-shadow:inset 0 0 0 3px #FFF8EC,inset 0 0 0 4.5px rgba(139,92,246,.45),0 0 26px -4px rgba(183,148,255,.9),0 10px 22px -6px rgba(0,0,0,.7);z-index:2}
.ctab[aria-selected="true"] .ix,.ctab[aria-selected="true"] .ix2{display:flex;position:absolute;flex-direction:column;align-items:center;line-height:.95;font-family:var(--f-magic);font-weight:900;font-size:17px}
.ctab[aria-selected="true"] .ix{top:5px;left:7px}
.ctab[aria-selected="true"] .ix2{bottom:5px;right:7px;transform:rotate(180deg)}
.ctab[aria-selected="true"] .ix small,.ctab[aria-selected="true"] .ix2 small{font-family:var(--f-body);font-size:15px}
.ctab[aria-selected="true"] .pip{display:block;position:absolute;left:0;right:0;top:12px;text-align:center;font-size:30px}
.ctab[aria-selected="true"] .lbl{top:48px;background:none;padding:0;font-size:14px;color:inherit}
.ctab.red[aria-selected="true"]{color:#C4214A}
.badge{position:absolute;top:-4px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--pink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--f-body)}

/* ---------- Hojas (detalle, edición) ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,3,20,.7);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:760px;max-height:94vh;overflow:auto;background:linear-gradient(180deg,#221A58,#160F3E);border:1px solid var(--line);border-bottom:0;
  border-radius:26px 26px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:4px auto 12px}
.sheet h2{font-family:var(--f-magic);font-size:22px;margin:0 0 4px;line-height:1.2}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sec{margin-top:16px;padding:14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.sec h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--violet2);font-weight:600}
.sec .txt{white-space:pre-wrap;font-size:16px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 38px}
.steps li::before{content:counter(s);position:absolute;left:0;top:5px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;
  background:linear-gradient(135deg,var(--violet),var(--blue))}
.secret{position:relative;overflow:hidden;border-color:rgba(255,211,110,.35);background:rgba(255,211,110,.06)}
.secret h4{color:var(--gold)}
.secret .txt.hide{filter:blur(7px);user-select:none}
.secret .reveal{position:absolute;inset:36px 0 0;display:grid;place-items:center}
.vlink{color:var(--cyan);word-break:break-all}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* Formulario */
form.stack{display:grid;gap:14px;margin-top:8px}
.field label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);outline:0;font-size:16px}
.field textarea{resize:vertical;min-height:80px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--violet2);box-shadow:0 0 0 3px rgba(183,148,255,.2)}
.field select option{background:#1B1446}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:14px}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--violet),var(--blue));border-color:transparent}

/* ---------- Sorpréndeme ---------- */
.hero{text-align:center;padding:18px 6px 6px}
.hero h2{font-family:var(--f-magic);font-size:24px;margin:0}
.hero p{color:var(--muted);margin:6px 0 0}
.panel{margin-top:14px;padding:14px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.panel h4{margin:0 0 4px;font-size:14px;color:var(--violet2);font-weight:600}
.abra{display:block;margin:20px auto 0;padding:18px 34px;font-size:20px;font-family:var(--f-magic);font-weight:900;border-radius:999px;color:#fff;
  background:linear-gradient(135deg,var(--pink),var(--violet),var(--blue));box-shadow:0 0 0 0 rgba(183,148,255,.7);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(183,148,255,0)}100%{box-shadow:0 0 0 0 rgba(183,148,255,0)}}
.stage{perspective:900px;margin-top:22px;min-height:20px}
.reveal-card{transform-style:preserve-3d;animation:flip .8s cubic-bezier(.3,1.3,.5,1)}
@keyframes flip{from{transform:rotateY(180deg) scale(.6);opacity:0}}
.sparkle{position:fixed;pointer-events:none;z-index:80;font-size:18px;animation:spark 1s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg);opacity:0}}

/* ---------- Mi show ---------- */
.showitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line)}
.showitem .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:rgba(255,255,255,.1)}
.showitem .nm{flex:1;min-width:0;text-align:left}
.showitem .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.showitem .nm small{color:var(--muted)}
.mini{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-size:15px}
.mini:disabled{opacity:.3}

/* Modo actuación */
.perform{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at top,#2B1B6E,#0A0820 70%);display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) 18px calc(14px + env(safe-area-inset-bottom,0px))}
.perform .ph{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.perform .pbody{flex:1;overflow:auto;padding:10px 0}
.perform h1{font-family:var(--f-magic);font-size:28px;line-height:1.15;margin:6px 0 4px}
.perform .sec .txt,.perform .steps li{font-size:19px}
.perform .pnav{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:#fff;color:#1B1446;padding:10px 16px;border-radius:14px;font-weight:600;box-shadow:var(--shadow);max-width:88vw;text-align:center}
.muted{color:var(--muted)}
.count{color:var(--muted);font-size:13.5px;margin:12px 2px 0}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(ellipse at center,#2B1B6E,#0A0820 70%);transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash .in{text-align:center;animation:pop .8s cubic-bezier(.3,1.5,.5,1)}
#splash .hat{width:110px;height:110px}
#splash .brand{font-size:30px;margin-top:10px}
#splash .sp-ver{position:fixed;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;letter-spacing:.08em;color:var(--muted)}
@keyframes pop{from{transform:scale(.5) rotate(-10deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A2A8F"/><stop offset="1" stop-color="#160F3E"/></linearGradient>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B794FF"/><stop offset="1" stop-color="#5EE1FF"/></linearGradient>
    <symbol id="hat" viewBox="0 0 64 64">

/* ================= Modelo de datos =================

const NIVELES=[
  {id:'aprendiendo',name:'Aprendiendo',icon:'🌱'},
  {id:'listo',name:'Me sale',icon:'✅'},
  {id:'estrella',name:'Número estrella',icon:'🌟'},
];
const NIV=Object.fromEntries(NIVELES.map(n=>[n.id,n]));
const PUBLICO=[
  {id:'ninos',name:'Niños',icon:'🧒'},
  {id:'adultos',name:'Adultos',icon:'🧑'},
  {id:'cerca',name:'De cerca',icon:'🤏'},
  {id:'grupo',name:'Para grupo',icon:'👨‍👩‍👧‍👦'},

const PUB=Object.fromEntries(PUBLICO.map(p=>[p.id,p]));
const SUITS=[['♠',''],['♥','r'],['♣',''],['♦','r']];

const EJEMPLOS=[
  {nombre:'La carta clave',cat:'encontrar',fav:true,
   efecto:'Un espectador elige una carta, la pierde en la baraja… y yo la encuentro.',
   prep:'Mira de reojo la carta de abajo del todo y recuérdala (la "carta clave"). Al juntar los montones queda justo encima de la suya.'},
  {nombre:'Las 21 cartas',cat:'auto',fav:false,
   efecto:'Alguien piensa una carta entre 21 y, tras repartirlas tres veces en columnas, aparece justo en el centro.',
   prep:'Separa 21 cartas. Reparte en 3 columnas, pon siempre su columna en medio; tras 3 repartos es la carta 11.'},
];

const APP_BUILD='9';
/* Si hay una versión nueva publicada, recarga sola (como la Cesta) */
function checkUpdate(){if(!/^https?:/.test(location.protocol))return;
  fetch('version.txt',{cache:'no-store'}).then(r=>r.ok?r.text():'').then(v=>{v=(v||'').trim();if(v&&v!==APP_BUILD&&!document.getElementById('scrim')){
    try{if(sessionStorage.getItem('magia-reload')===v)return;sessionStorage.setItem('magia-reload',v)}catch(_){}location.reload()}}).catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
checkUpdate();
if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(e=>console.warn('SW',e));
const S={juegos:{},rutinas:{},tipos:DEFAULT_TIPOS.map(t=>({...t})),tab:'juegos',q:'',cat:'',lv:'',rut:null,loaded:false};
let db=null,mode='loading';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||('t'+Date.now().toString(36));
const newId=p=>(p||'j')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const wands=n=>'🪄'.repeat(Math.max(1,Math.min(3,+n||1)));
const tipoOf=id=>S.tipos.find(t=>t.id===id)||{id:'',name:'Sin tipo',icon:'🃏'};
const hash=s=>[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0);
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400)}

/* ================= Guardado (base de datos de la app o este navegador) ================= */
const LS='magia-molona-local-v1';
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j){S.juegos=j.juegos||{};S.rutinas=j.rutinas||{};if(Array.isArray(j.tipos)&&j.tipos.length)S.tipos=j.tipos}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({juegos:S.juegos,rutinas:S.rutinas,tipos:S.tipos}))}catch(e){}}
function writeFail(e){console.warn(e);toast(e&&e.code==='quota_exceeded'?'No queda espacio para guardar':'No se pudo guardar. Prueba otra vez')}
const store={
  async saveJuego(id,j){S.juegos[id]=j;render();saveLocal();if(db)await db.doc('juegos/'+id).set(j).catch(writeFail)},
  async deleteJuego(id){delete S.juegos[id];
    for(const [rid,r] of Object.entries(S.rutinas))if((r.ids||[]).includes(id))store.saveRutina(rid,{...r,ids:r.ids.filter(x=>x!==id)});
    render();saveLocal();if(db)await db.doc('juegos/'+id).delete().catch(writeFail)},
  async saveRutina(id,r){S.rutinas[id]=r;render();saveLocal();if(db)await db.doc('rutinas/'+id).set(r).catch(writeFail)},
  async deleteRutina(id){delete S.rutinas[id];if(S.rut===id)S.rut=null;render();saveLocal();if(db)await db.doc('rutinas/'+id).delete().catch(writeFail)},
  async saveTipos(){render();saveLocal();if(db)await db.doc('settings/tipos').set({list:S.tipos}).catch(writeFail)}
};

const FB_CFG={apiKey:"AIzaSyBrBUSYag8bAXb57PA9nbapF7FEtWwwhxE",authDomain:"cesta-molona-90b34.firebaseapp.com",projectId:"cesta-molona-90b34",storageBucket:"cesta-molona-90b34.firebasestorage.app",messagingSenderId:"654394513167",appId:"1:654394513167:web:4af24e2aa392ca6489d07a"};
const FB_URL='https://www.gstatic.com/firebasejs/10.12.2/';
const NUBE_LS='magia-nube';
const nubeCode=()=>{try{return localStorage.getItem(NUBE_LS)||''}catch(_){return ''}};
const fmtCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/O/g,'0').replace(/I|L/g,'1');

function newCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';const r=crypto.getRandomValues(new Uint32Array(12));return [...r].map(n=>A[n%A.length]).join('')}
let _fb=null,nube=null,nubeErr='';
async function fbOpen(){if(_fb)return _fb;
  const imp=n=>import(FB_URL+n);
  const [A,U,F]=await Promise.all([imp('firebase-app.js'),imp('firebase-auth.js'),imp('firebase-firestore.js')]);
  const app=A.initializeApp(FB_CFG,'magia');const auth=U.getAuth(app);
  await new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('Sin conexión con la nube')),15000);
    const off=U.onAuthStateChanged(auth,u=>{if(u){clearTimeout(t);off();res()}else U.signInAnonymously(auth).catch(e=>{clearTimeout(t);rej(e)})})});
  let fs;try{fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){console.warn(e);fs=F.getFirestore(app)}
  return _fb={F,fs}}
const fbClean=v=>JSON.parse(JSON.stringify(v??{}));
async function nubeDb(code){const {F,fs}=await fbOpen();const root='casas/'+code;
  const wrap=d=>({id:d.id,exists:d.exists(),data:()=>d.data()});
  return {nube:code,F,fs,root,
    doc(p){const r=F.doc(fs,root+'/'+p);return{set:v=>F.setDoc(r,fbClean(v)),delete:()=>F.deleteDoc(r),get:async()=>wrap(await F.getDoc(r)),onSnapshot:(cb,err)=>F.onSnapshot(r,d=>cb(wrap(d)),err)}},
    collection(n){const r=F.collection(fs,root+'/'+n);return{onSnapshot:(cb,err)=>F.onSnapshot(r,q=>cb({docs:q.docs.map(wrap)}),err)}}}}
/* Sube todo lo que hay en este móvil (textos y archivos) a la nube */
async function nubeUpload(cdb){const {F,fs,root}=cdb;const ops=[];
  Object.entries(S.juegos).forEach(([id,v])=>ops.push(['juegos/'+id,v]));
  Object.entries(S.rutinas).forEach(([id,v])=>ops.push(['rutinas/'+id,v]));
  ops.push(['settings/tipos',{list:S.tipos}]);
  for(let i=0;i<ops.length;i+=400){const b=F.writeBatch(fs);ops.slice(i,i+400).forEach(([p,v])=>b.set(F.doc(fs,root+'/'+p),fbClean(v)));await b.commit()}
  let all={};try{all=await media.all()}catch(_){}
  for(const [id,r] of Object.entries(all))await cloudMedia.up(id,r.blob,r.type,r.name).catch(e=>console.warn(e))}
async function nubeCreate(){const code=newCode();const {F,fs}=await fbOpen();
  await F.setDoc(F.doc(fs,'casas/'+code),{creada:new Date().toISOString(),app:'La Magia Molona'});
  const cdb=await nubeDb(code);nube=cdb;try{await nubeUpload(cdb)}catch(e){nube=null;throw e}
  localStorage.setItem(NUBE_LS,code);return code}
async function nubeJoin(raw){const code=fmtCode(raw);if(code.length!==12)throw new Error('El código tiene 12 letras y números');
  const {F,fs}=await fbOpen();const d=await F.getDoc(F.doc(fs,'casas/'+code));
  if(!d.exists())throw new Error('No existe ningún código así');
  localStorage.setItem(NUBE_LS,code);return code}

/* Fotos, vídeos y audios en la nube, en trozos (cada documento admite como mucho 1 MB) */
const CHUNK=700000;
const cloudMedia={
  async up(id,blob,type,name){if(!nube)return;const {F,fs,root}=nube;
    const data=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>rej(fr.error);fr.readAsDataURL(blob)});
    const n=Math.max(1,Math.ceil(data.length/CHUNK));
    for(let i=0;i<n;i++)await F.setDoc(F.doc(fs,root+'/mediaparts/'+id+'_'+i),{d:data.slice(i*CHUNK,(i+1)*CHUNK)});
    await F.setDoc(F.doc(fs,root+'/media/'+id),{type:type||blob.type||'',name:name||'',n,size:blob.size})},
  async down(id){if(!nube)return null;const {F,fs,root}=nube;
    const m=await F.getDoc(F.doc(fs,root+'/media/'+id));if(!m.exists())return null;const {type,name,n}=m.data();
    let data='';for(let i=0;i<n;i++){const c=await F.getDoc(F.doc(fs,root+'/mediaparts/'+id+'_'+i));if(!c.exists())return null;data+=c.data().d}
    const bin=atob(data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return {blob:new Blob([u],{type}),type,name}},
  async del(id){if(!nube)return;const {F,fs,root}=nube;try{const m=await F.getDoc(F.doc(fs,root+'/media/'+id));const n=m.exists()?m.data().n:0;
    await F.deleteDoc(F.doc(fs,root+'/media/'+id));for(let i=0;i<n;i++)await F.deleteDoc(F.doc(fs,root+'/mediaparts/'+id+'_'+i))}catch(e){console.warn(e)}}
};

function subscribe(){
  const timer=setTimeout(()=>{if(!S.loaded){S.loaded=true;render();toast('Tardando en cargar: uso la copia de este móvil')}},10000);
  db.collection('juegos').onSnapshot(snap=>{clearTimeout(timer);const o={};snap.docs.forEach(d=>o[d.id]=d.data());S.juegos=o;S.loaded=true;saveLocal();render()},e=>{clearTimeout(timer);console.warn(e);S.loaded=true;render()});
  db.collection('rutinas').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]=d.data());S.rutinas=o;saveLocal();render()},e=>console.warn(e));
  db.doc('settings/tipos').onSnapshot(d=>{const l=d.exists&&d.data().list;if(Array.isArray(l)&&l.length){S.tipos=l;saveLocal();render()}},e=>console.warn(e));
}
async function boot(){
  loadLocal();render();
  try{if(window.claude&&claude.use)db=await claude.use('db')}catch(e){db=null}
  if(db){
    mode='db';
    const ban=document.createElement('a');ban.href='https://celacanto.github.io/cesta-molona/magia/';ban.target='_blank';ban.rel='noopener';ban.className='ghban';
    ban.innerHTML='🐇 Esta es la copia de Claude. Tu app del móvil, con el conejito, está aquí: <b>celacanto.github.io/cesta-molona/magia</b>';
    document.querySelector('header.top').appendChild(ban);
    subscribe();return}
  /* App del móvil: todo se guarda en la nube */
  S.loaded=true;render();
  try{let code=nubeCode();
    if(!code){code=await nubeCreate();toast('☁️ Tus juegos ya se guardan en la nube')}
    nube=await nubeDb(code);db=nube;mode='nube';S.loaded=false;subscribe();render()}
  catch(e){console.warn(e);nubeErr=String(e&&e.message||e);mode='local';db=null;nube=null;S.loaded=true;render();toast('Sin conexión con la nube: guardo en este móvil')}
}

const list=()=>Object.entries(S.juegos).map(([id,j])=>({id,...j}));
function matches(j){
  if(S.cat==='__fav'){if(!j.fav)return false}else if(S.cat&&j.cat!==S.cat)return false;
  if(S.q){const hay=norm([j.nombre,j.efecto,j.prep,tipoOf(j.cat).name].join(' '));
    return norm(S.q).split(/\s+/).every(t=>hay.includes(t))}
  return true}
function render(){
  const all=list();
  $('#sub').textContent=all.length?`${all.length} ${all.length===1?'juego':'juegos'} en la chistera`:'Mis juegos de cartomagia';
  const nr=Object.keys(S.rutinas).length,rb=$('#rut-badge');rb.hidden=!nr;rb.textContent=nr;
  $('#fab').setAttribute('aria-label',S.tab==='juegos'?'Añadir un juego':S.rut?'Añadir juegos a la rutina':'Nueva rutina');

function card(j){const c=tipoOf(j.cat);
  return `<button class="line" data-open="${j.id}"><span class="li">${esc(c.icon)}</span><span class="ln">${esc(j.nombre||'Sin nombre')}</span>${j.fav?'<span class="lf" aria-label="Favorito">⭐</span>':''}</button>`}
function renderList(all){
  $('#lv-chips').hidden=!all.length;

    $('#list').innerHTML=`<div class="empty"><span class="big">🐇</span><h2>Tu chistera está vacía</h2><p>Pulsa el <b>＋</b> para apuntar tu primer juego,<br>o carga dos de ejemplo para ver cómo queda.</p>

  const r=all.filter(matches).sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||(a.nombre||'').localeCompare(b.nombre||'','es'));

/* ---------- La chuleta de un juego ---------- */
function chuleta(j,big){
  const sec=(t,k)=>{const v=j[k],m=(j.media||{})[k]||[];return (v||m.length)?`<div class="sec"><h4>${t}</h4>${v?`<div class="txt">${esc(v)}</div>`:''}${mediaHtml(m)}</div>`:''};
  const mn=(j.media||{}).nombre||[];
  return `${big?`<h1>${esc(j.nombre)}</h1>`:`<h2>${esc(j.nombre||'Sin nombre')}</h2>`}
   ${mn.length?mediaHtml(mn):''}
   ${sec('Efecto','efecto')}
   ${sec('Método','prep')}`}
function openDetail(id){const j=S.juegos[id];if(!j)return;
  sheet(`<div class="grab"></div>${chuleta(j)}
   <div class="dtools">
     <button class="mini" data-act="edit" aria-label="Editar" title="Editar">✏️</button>
     <button class="mini" data-act="fav" aria-label="${j.fav?'Quitar de favoritos':'Marcar favorito'}" title="Favorito">${j.fav?'⭐':'☆'}</button>
     <button class="mini" data-act="rut" aria-label="Rutinas" title="Rutinas">🎪</button>
     <button class="mini" data-act="del" aria-label="Borrar" title="Borrar">🗑</button>
   </div>`,
  async e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
    if(act==='edit')openEdit(id);
    if(act==='fav'){await store.saveJuego(id,{...j,fav:!j.fav});openDetail(id)}
    if(act==='rut')openRutPicker(id);
    if(act==='del'){if(a.dataset.sure){for(const ids of Object.values(j.media||{}))ids.forEach(m=>media.del(m));await store.deleteJuego(id);closeSheet();toast('Juego borrado')}else{a.dataset.sure=1;a.textContent='¿Borrar?';a.style.width='auto';a.style.padding='0 10px'}}
  });
  $('#sheet-root .sheet').classList.add('full');
  hydrateMedia($('#sheet-root'));
}

   <div class="tiporow" style="margin-top:14px"><div class="field nm-in"><input id="nr-name" placeholder="Nueva rutina, p. ej. Cumple de Lucía"></div><button class="btn sm" data-act="new">＋ Crear</button></div>

/* ---------- Añadir / editar juego ---------- */
function openEdit(id){const isNew=!id;const j=isNew?{}:{...S.juegos[id]};
  const M={nombre:[...((j.media||{}).nombre||[])],efecto:[...((j.media||{}).efecto||[])],prep:[...((j.media||{}).prep||[])]};
  const added=[],removed=[];
  const tools=k=>`<div class="mtools"><button type="button" class="mbtn" data-cam="${k}" aria-label="Hacer foto o vídeo">📷</button><button type="button" class="mbtn" data-mic="${k}" aria-label="Grabar audio">🎤</button><button type="button" class="mbtn" data-file="${k}" aria-label="Adjuntar foto, vídeo o audio">📎</button></div>`;
  const mbox=k=>`<div class="mlist" data-mlist="${k}">${mediaHtml(M[k],true)}</div>`;
  sheet(`<div class="grab"></div><h2>${isNew?'Nuevo juego':'Editar juego'}</h2>
  <form class="stack" id="ef" autocomplete="off">
    <div class="field"><label for="f-nombre">Nombre del juego</label><input id="f-nombre" required value="${esc(j.nombre)}" placeholder="Ej. La carta que sube">${M.nombre.length?mbox('nombre'):''}</div>
    <div class="field"><label for="f-efecto">✨ Efecto</label><textarea id="f-efecto" rows="3" placeholder="Qué pasa, contado como lo vería un espectador">${esc(j.efecto)}</textarea>${M.efecto.length?mbox('efecto'):''}</div>
    <div class="field"><div class="flab"><label for="f-prep">🔑 Método</label>${tools('prep')}</div><textarea id="f-prep" rows="3" placeholder="Cómo se hace">${esc(j.prep)}</textarea>${mbox('prep')}</div>
    <div class="recbar" id="recbar" hidden><span class="dot"></span><span id="rec-t">0:00</span> Grabando…<button type="button" class="btn sm" id="rec-stop">⏹ Parar</button></div>
    <div class="formbtns"><button class="btn ghost" type="button" data-cancel>Cancelar</button><button class="btn" type="submit">${isNew?'🎩 Guardar':'💾 Guardar'}</button></div>
    <input type="file" id="f-cam" accept="image/*,video/*" capture="environment" hidden>
    <input type="file" id="f-micfile" accept="audio/*" capture hidden>
    <input type="file" id="f-any" accept="image/*,video/*,audio/*" multiple hidden>
  </form>`,
  async e=>{const t=e.target;
    if(t.closest('[data-cancel]')){added.forEach(m=>media.del(m));isNew?closeSheet():openDetail(id);return}
    const cam=t.closest('[data-cam]');if(cam){target=cam.dataset.cam;$('#f-cam').click();return}
    const fl=t.closest('[data-file]');if(fl){target=fl.dataset.file;$('#f-any').click();return}
    const mic=t.closest('[data-mic]');if(mic){target=mic.dataset.mic;startRec();return}
    const rm=t.closest('[data-mdel]');if(rm){const mid=rm.dataset.mdel;for(const k in M)M[k]=M[k].filter(x=>x!==mid);removed.push(mid);redraw();return}
  });
  let target='prep',rec=null,chunks=[],tick=null;
  function redraw(){for(const k in M){const el=document.querySelector(`[data-mlist="${k}"]`);if(el)el.innerHTML=mediaHtml(M[k],true)}hydrateMedia($('#ef'))}
  async function addFiles(files){for(const f of files){if(!/^(image|video|audio)\//.test(f.type)){toast('Solo fotos, vídeos o audios');continue}
      try{const mid=await media.put(f);M[target].push(mid);added.push(mid)}catch(err){console.warn(err);toast(/grande/.test(err.message)?err.message:'No se pudo guardar el archivo')}}redraw()}
  ['f-cam','f-micfile','f-any'].forEach(x=>$('#'+x).addEventListener('change',e=>{addFiles([...e.target.files]);e.target.value=''}));
  async function startRec(){if(rec){toast('Ya estás grabando');return}
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(err){$('#f-micfile').click();return}
    chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(tick);$('#recbar').hidden=true;const type=rec.mimeType||'audio/webm';rec=null;
      const blob=new Blob(chunks,{type});if(blob.size){const f=new File([blob],'audio.'+(type.includes('mp4')?'m4a':'webm'),{type});await addFiles([f]);toast('Audio guardado 🎤')}};
    rec.start();const t0=Date.now();$('#recbar').hidden=false;$('#rec-t').textContent='0:00';
    tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#rec-t').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500)}
  $('#rec-stop').addEventListener('click',()=>rec&&rec.stop());
  hydrateMedia($('#ef'));
  
  $('#ef').addEventListener('submit',async ev=>{ev.preventDefault();if(rec){toast('Para la grabación primero');return}
    const v=k=>$('#f-'+k).value.trim();
    const out={...j,nombre:v('nombre'),efecto:v('efecto'),prep:v('prep'),media:M};
    if(isNew){out.creado=today();out.fav=false}
    removed.forEach(m=>media.del(m));
    const nid=id||newId();await store.saveJuego(nid,out);toast(isNew?'¡Juego guardado! 🎩':'Cambios guardados');if(isNew)sparkles($('#fab'));openDetail(nid)});
  if(isNew)setTimeout(()=>$('#f-nombre').focus(),300);
}

function openTipos(){const cnt=id=>list().filter(j=>j.cat===id).length;

      <input class="nm-in" data-k="name" value="${esc(t.name)}" aria-label="Nombre del tipo" style="padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:16px">

      <button class="mini" data-del="${i}" aria-label="Borrar tipo" title="${cnt(t.id)} juegos">✕</button></div>`).join('');

    <div id="tp-rows">${rows}</div>
    <div class="sec"><h4>＋ Tipo nuevo</h4><div class="tiporow" style="margin-top:0"><input class="emo-in" id="tp-ico" value="🃏" maxlength="4" aria-label="Emoji" style="border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:18px">
      <input class="nm-in" id="tp-name" placeholder="Ej. Juegos con baraja preparada" style="padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:16px"><button class="btn sm" data-act="add">Añadir</button></div></div>
    <button class="btn wide" style="margin-top:16px" data-act="save">💾 Guardar tipos</button>`,
  e=>{const t=e.target;const read=()=>{document.querySelectorAll('#tp-rows .tiporow').forEach(r=>{const x=S.tipos[+r.dataset.i];if(!x)return;
        x.icon=r.querySelector('[data-k=icon]').value.trim()||'🃏';x.name=r.querySelector('[data-k=name]').value.trim()||x.name})};
    const up=t.closest('[data-up]');if(up){read();const i=+up.dataset.up;[S.tipos[i-1],S.tipos[i]]=[S.tipos[i],S.tipos[i-1]];store.saveTipos();openTipos();return}
    const del=t.closest('[data-del]');if(del){const i=+del.dataset.del,x=S.tipos[i],n=cnt(x.id);
      if(!del.dataset.sure){del.dataset.sure=1;del.textContent='¿?';toast(n?`${n} juegos quedarán «Sin tipo». Pulsa otra vez para borrar`:'Pulsa otra vez para borrar');return}
      read();S.tipos.splice(i,1);if(S.cat===x.id)S.cat='';store.saveTipos();openTipos();return}
    const a=t.closest('[data-act]');if(!a)return;
    if(a.dataset.act==='add'){read();const nm=$('#tp-name').value.trim();if(!nm){$('#tp-name').focus();return}
      if(S.tipos.some(x=>norm(x.name)===norm(nm))){toast('Ese tipo ya existe');return}
      let id=slug(nm);while(S.tipos.some(x=>x.id===id))id+='-2';S.tipos.push({id,name:nm,icon:$('#tp-ico').value.trim()||'🃏'});store.saveTipos();toast('Tipo añadido 🏷️');openTipos()}
    if(a.dataset.act==='save'){read();store.saveTipos();closeSheet();toast('Tipos guardados 🏷️')}
  });
}

/* ---------- Fotos, vídeos y audios (guardados en este móvil) ---------- */
const media={_db:null,
  open(){if(this._db)return this._db;return this._db=new Promise((res,rej)=>{const r=indexedDB.open('magia-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async tx(mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('m',mode);const out=fn(t.objectStore('m'));t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})},
  async put(file){if(file.size>40e6)throw new Error('Archivo demasiado grande (máx. 40 MB). Graba un vídeo más corto');
    if(/^image\/(jpeg|png|webp|heic)/.test(file.type)&&file.size>500e3)file=await shrinkImg(file).catch(()=>file);
    const id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await this.tx('readwrite',s=>s.put({blob:file,type:file.type,name:file.name||''},id));
    if(nube)cloudMedia.up(id,file,file.type,file.name).catch(e=>{console.warn(e);toast('El archivo se ha guardado en el móvil, pero no en la nube')});
    return id},
  async get(id){return this.tx('readonly',s=>s.get(id))},
  async del(id){try{await this.tx('readwrite',s=>s.delete(id))}catch(_){}cloudMedia.del(id)},
  async all(){const d=await this.open();return new Promise((res,rej)=>{const out={};const t=d.transaction('m');const c=t.objectStore('m').openCursor();c.onsuccess=()=>{const k=c.result;if(k){out[k.key]=k.value;k.continue()}else res(out)};c.onerror=()=>rej(c.error)})}
};
const _urls={};
function shrinkImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
  c.toBlob(b=>b?res(new File([b],(file.name||'foto').replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'})):rej(new Error('jpg')),'image/jpeg',.82)};im.onerror=rej;im.src=u})}
const mediaCount=j=>Object.values(j.media||{}).reduce((a,x)=>a+(x||[]).length,0);
function mediaHtml(ids,edit){return (ids||[]).length?`<div class="mgrid">${ids.map(id=>`<div class="mitem" data-mid="${id}"><span class="mload">⏳</span>${edit?`<button type="button" class="mdel" data-mdel="${id}" aria-label="Quitar archivo">✕</button>`:''}</div>`).join('')}</div>`:''}
async function hydrateMedia(root){if(!root)return;for(const el of root.querySelectorAll('[data-mid]')){if(el.dataset.ok)continue;el.dataset.ok=1;const id=el.dataset.mid;
  let rec;try{rec=await media.get(id)}catch(_){}
  if(!rec&&nube){try{rec=await cloudMedia.down(id);if(rec)await media.tx('readwrite',st=>st.put(rec,id))}catch(e){console.warn(e)}}
  if(!rec){el.querySelector('.mload').textContent='❔';el.title='Este archivo no está en este dispositivo';continue}
  const url=_urls[id]||(_urls[id]=URL.createObjectURL(rec.blob));const t=rec.type||'';let node;
  if(t.startsWith('image/')){node=document.createElement('img');node.src=url;node.alt='';node.addEventListener('click',()=>viewImg(url))}
  else if(t.startsWith('video/')){node=document.createElement('video');node.src=url;node.controls=true;node.playsInline=true;node.preload='metadata'}
  else{node=document.createElement('audio');node.src=url;node.controls=true;el.classList.add('aud')}
  el.querySelector('.mload').replaceWith(node)}}
function viewImg(url){const d=document.createElement('div');d.className='imgview';d.innerHTML=`<img src="${url}" alt="">`;d.addEventListener('click',()=>d.remove());document.body.appendChild(d)}

/* ---------- Hojas ---------- */
function sheet(html,onClick){const root=$('#sheet-root');root.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const sc=$('#scrim');sc.addEventListener('click',e=>{if(e.target===sc)closeSheet();else onClick&&onClick(e)});document.body.style.overflow='hidden'}
function closeSheet(){$('#sheet-root').innerHTML='';document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#perform-root').innerHTML)closePerform();else closeSheet()}});

/* ---------- Rutinas ---------- */
const rutIds=r=>(r.ids||[]).filter(id=>S.juegos[id]);
function renderRutinas(){
  const r=S.rut&&S.rutinas[S.rut];
  if(r)return renderRutina(S.rut,r);
  S.rut=null;
  const rs=Object.entries(S.rutinas).sort((a,b)=>(a[1].nombre||'').localeCompare(b[1].nombre||'','es'));
  if(!rs.length){$('#rutinas').innerHTML=`<div class="hero"><h2>Rutinas</h2><p>Junta varios juegos en orden para una actuación: un cumple, una cena, la clase…</p></div>
    <div class="empty"><span class="big">🎪</span><h2>Aún no tienes rutinas</h2><p>Pulsa el <b>＋</b> para crear la primera.</p></div>`;return}
  $('#rutinas').innerHTML=`<div class="hero"><h2>Rutinas</h2><p>Tus actuaciones, con los juegos en orden.</p></div><div class="list">${rs.map(([id,r])=>{const ids=rutIds(r),su=SUITS[hash(id)%4];
    return `<button class="trick" data-rut="${id}"><span class="emo">🎪</span><span class="body"><h3>${esc(r.nombre)}</h3><p>${ids.map(x=>esc(S.juegos[x].nombre)).join(' → ')||'Sin juegos todavía'}</p>
      <span class="meta"><span class="tag">🃏 ${ids.length} ${ids.length===1?'juego':'juegos'}</span></span></span><span class="suit ${su[1]}" aria-hidden="true">${su[0]}</span></button>`}).join('')}</div>`;
}
function renderRutina(rid,r){const ids=rutIds(r);
  $('#rutinas').innerHTML=`<div class="rhead"><button class="mini" data-rback aria-label="Volver a rutinas">◀</button><h2>${esc(r.nombre)}</h2><button class="mini" data-rren aria-label="Cambiar nombre">✏️</button></div>
   <div class="count">${ids.length} ${ids.length===1?'juego':'juegos'}</div>
   ${ids.length?`<div class="list">${ids.map((id,i)=>{const j=S.juegos[id],c=tipoOf(j.cat);return `<div class="showitem"><span class="n">${i+1}</span>
     <button class="nm" data-open="${id}"><b>${esc(c.icon)} ${esc(j.nombre)}</b><small>${esc(c.name)}</small></button>
     <button class="mini" data-mv="${i}" data-d="-1" aria-label="Subir" ${i?'':'disabled'}>▲</button><button class="mini" data-mv="${i}" data-d="1" aria-label="Bajar" ${i<ids.length-1?'':'disabled'}>▼</button>
     <button class="mini" data-rm="${id}" aria-label="Quitar de la rutina">✕</button></div>`}).join('')}</div>
   <button class="abra" id="perform">🎭 Modo actuación</button>`:`<div class="empty"><span class="big">🃏</span>Esta rutina está vacía.<br>Pulsa <b>＋</b> para añadir juegos.</div>`}
   <div class="row" style="justify-content:center;margin-top:16px"><button class="btn ghost sm" data-addj>＋ Añadir juegos</button><button class="btn danger sm" id="rut-del">🗑 Borrar rutina</button></div>`;
}
function newRutina(){sheet(`<div class="grab"></div><h2>Nueva rutina</h2><form class="stack" id="nr"><div class="field"><label for="nr-n">Nombre</label><input id="nr-n" required placeholder="Ej. Cumple de Lucía, Cena de Navidad…"></div><button class="btn wide">🎪 Crear rutina</button></form>`);
  $('#nr').addEventListener('submit',async e=>{e.preventDefault();const id=newId('r');await store.saveRutina(id,{nombre:$('#nr-n').value.trim(),ids:[],creado:today()});S.rut=id;closeSheet();render();pickJuegos(id)});
  setTimeout(()=>$('#nr-n').focus(),300)}
function renameRutina(rid){const r=S.rutinas[rid];sheet(`<div class="grab"></div><h2>Nombre de la rutina</h2><form class="stack" id="rn"><div class="field"><input id="rn-n" required value="${esc(r.nombre)}"></div><button class="btn wide">💾 Guardar</button></form>`);
  $('#rn').addEventListener('submit',e=>{e.preventDefault();store.saveRutina(rid,{...S.rutinas[rid],nombre:$('#rn-n').value.trim()});closeSheet()})}
function pickJuegos(rid){const all=list().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
  sheet(`<div class="grab"></div><h2>Añadir juegos</h2><p class="hint">Marca los juegos de «${esc(S.rutinas[rid].nombre)}». Se añaden al final; luego los ordenas.</p>
   ${all.map(j=>`<button class="pickrow" data-pj="${j.id}" aria-pressed="${(S.rutinas[rid].ids||[]).includes(j.id)}"><span class="ck"></span><span>${esc(tipoOf(j.cat).icon)} ${esc(j.nombre)} </span></button>`).join('')||'<p class="muted">Primero guarda algún juego en la pestaña Juegos.</p>'}
   <button class="btn wide" style="margin-top:14px" data-act="ok">Listo</button>`,
  async e=>{const p=e.target.closest('[data-pj]');if(p){const r=S.rutinas[rid],ids=r.ids||[],on=ids.includes(p.dataset.pj);
      await store.saveRutina(rid,{...r,ids:on?ids.filter(x=>x!==p.dataset.pj):[...ids,p.dataset.pj]});p.setAttribute('aria-pressed',!on);return}
    if(e.target.closest('[data-act=ok]'))closeSheet()});
}
let P=0;
function openPerform(i){const r=S.rutinas[S.rut];if(!r)return;const ids=rutIds(r);if(!ids.length)return;P=Math.max(0,Math.min(ids.length-1,i));const j=S.juegos[ids[P]];
  $('#perform-root').innerHTML=`<div class="perform" role="dialog" aria-modal="true" aria-label="Modo actuación">
    <div class="ph"><span>🎭 ${esc(r.nombre)} · ${P+1} / ${ids.length}</span><button class="iconbtn" id="p-close" aria-label="Salir">✕</button></div>
    <div class="pbody">${chuleta(j,true)}</div>
    <div class="pnav"><button class="btn ghost" id="p-prev" ${P?'':'disabled style="opacity:.35"'}>◀ Anterior</button><button class="btn" id="p-next">${P<ids.length-1?'Siguiente ▶':'🎉 ¡Fin!'}</button></div></div>`;
  document.body.style.overflow='hidden';hydrateMedia($('#perform-root'))}
function closePerform(){$('#perform-root').innerHTML='';document.body.style.overflow=''}
$('#perform-root').addEventListener('click',e=>{const r=S.rutinas[S.rut];const n=r?rutIds(r).length:0;
  if(e.target.closest('#p-close'))closePerform();
  if(e.target.closest('#p-prev'))openPerform(P-1);
  if(e.target.closest('#p-next')){if(P<n-1)openPerform(P+1);else{closePerform();toast('¡Bravo! 👏👏👏');sparkles($('#perform')||$('#fab'),24)}}});

/* ---------- Ajustes y copia de seguridad ---------- */
function openSettings(){const n=list().length;
  sheet(`<div class="grab"></div><h2>Ajustes</h2>
   ${mode==='db'?`<div class="sec"><h4>💾 Dónde se guardan tus juegos</h4><div class="txt">Esta es la copia de Claude. Tu app de verdad está en <a class="vlink" href="https://celacanto.github.io/cesta-molona/magia/" target="_blank" rel="noopener">celacanto.github.io/cesta-molona/magia</a></div></div>`:
   nube?`<div class="sec"><h4>☁️ En la nube</h4><div class="txt">Todo (juegos, rutinas, fotos, vídeos y audios) se guarda en la nube. Si el móvil se rompe, no se pierde nada.</div>
     <p class="hint" style="margin-top:10px">Tu código. <b>Apúntalo en un sitio seguro</b>: lo necesitas para abrir tus juegos en otro móvil.</p>
     <div style="font-size:24px;font-weight:700;letter-spacing:.08em;margin:6px 0 10px;color:var(--gold)">${showCode(nube.nube)}</div>
     <div class="row"><button class="btn sm" data-act="ccode">📋 Copiar código</button><button class="btn ghost sm" data-act="join">🔑 Usar otro código</button></div></div>`:
   `<div class="sec"><h4>☁️ Nube</h4><div class="txt">Ahora mismo no hay conexión con la nube: lo que apuntes se guarda en este móvil y se subirá cuando vuelvas a abrir la app con internet.</div>
     <div class="row" style="margin-top:10px"><button class="btn sm" data-act="retry">🔄 Reintentar</button><button class="btn ghost sm" data-act="join">🔑 Tengo un código</button></div></div>`}
   <div class="sec" id="join-box" hidden><h4>🔑 Abrir con un código</h4><div class="txt muted" style="font-size:14px">Escribe el código de 12 letras. Este móvil pasará a mostrar los juegos guardados con ese código.</div>
     <div class="tiporow"><input class="nm-in" id="join-code" placeholder="ABCD-EFGH-JKMN" autocapitalize="characters" style="padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:16px"><button class="btn sm" data-act="dojoin">Abrir</button></div></div>
   <div class="sec"><h4>📦 Copia de seguridad</h4><div class="txt muted" style="font-size:14px">Guarda todos tus juegos (${n}), rutinas y tipos, o recupéralos desde una copia.</div>
     <div class="row" style="margin-top:10px"><button class="btn sm" data-act="dl">⬇️ Descargar copia completa</button><button class="btn ghost sm" data-act="file">📂 Cargar copia</button></div>
     <p class="hint">La copia completa lleva también las fotos, vídeos y audios. «Copiar texto» solo lleva los textos.</p>
     <div class="row"><button class="btn ghost sm" data-act="copy">📋 Copiar texto</button></div>
     <div class="field" style="margin-top:10px"><textarea id="bk-txt" rows="4" placeholder="Aquí aparece tu copia, o pega aquí una copia para cargarla"></textarea></div>
     <button class="btn ghost sm" data-act="import">⬆️ Cargar lo pegado</button>
     <input type="file" id="bk-file" accept=".json,.txt,application/json,text/plain" hidden></div>
   <p class="hint" style="text-align:center;margin-top:14px">La Magia Molona · versión ${APP_BUILD}</p>`,
  async e=>{const a=e.target.closest('[data-act]');if(!a)return;
    if(a.dataset.act==='tipos')openTipos();
    if(a.dataset.act==='ccode'){try{await navigator.clipboard.writeText(showCode(nube.nube));toast('Código copiado 📋')}catch(_){toast('Apúntalo a mano: '+showCode(nube.nube))}}
    if(a.dataset.act==='join'){$('#join-box').hidden=false;$('#join-code').focus()}
    if(a.dataset.act==='retry'){location.reload()}
    if(a.dataset.act==='dojoin'){a.disabled=true;try{await nubeJoin($('#join-code').value);try{localStorage.removeItem(LS)}catch(_){}toast('¡Conectado! Cargando tus juegos…');setTimeout(()=>location.reload(),700)}catch(err){toast(err.message||'No se pudo conectar');a.disabled=false}}
    if(a.dataset.act==='copy'){const t=JSON.stringify({app:'La Magia Molona',v:2,fecha:today(),juegos:S.juegos,rutinas:S.rutinas,tipos:S.tipos});$('#bk-txt').value=t;
      try{await navigator.clipboard.writeText(t);toast('Copiado. Pégalo en una nota o un correo 📋')}catch(_){$('#bk-txt').select();toast('Selecciona el texto y cópialo')}}
    if(a.dataset.act==='file')$('#bk-file').click();
    if(a.dataset.act==='dl'){a.disabled=true;a.textContent='Preparando…';try{const all=await media.all();const md={};
        for(const [id,r] of Object.entries(all))md[id]={type:r.type,name:r.name,data:await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(r.blob)})};
        const blob=new Blob([JSON.stringify({app:'La Magia Molona',v:3,fecha:today(),juegos:S.juegos,rutinas:S.rutinas,tipos:S.tipos,media:md})],{type:'application/json'});
        const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='magia-molona-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Copia descargada ⬇️')}
      catch(err){console.warn(err);toast('No se pudo preparar la copia')}a.disabled=false;a.textContent='⬇️ Descargar copia completa'}
    if(a.dataset.act==='import')importText($('#bk-txt').value);
  });
  $('#bk-file').addEventListener('change',async e=>{const f=e.target.files[0];if(f)importText(await f.text())});
}
async function importText(t){let d;try{d=JSON.parse(t)}catch(_){toast('Eso no parece una copia válida');return}
  if(!d||typeof d.juegos!=='object'){toast('No encuentro juegos en esa copia');return}
  if(d.media&&typeof d.media==='object'){for(const [id,m] of Object.entries(d.media)){try{const b=await (await fetch(m.data)).blob();await media.tx('readwrite',st=>st.put({blob:b,type:m.type||b.type,name:m.name||''},id))}catch(err){console.warn(err)}}}
  if(Array.isArray(d.tipos)&&d.tipos.length){for(const x of d.tipos)if(x&&x.id&&!S.tipos.some(y=>y.id===x.id))S.tipos.push(x);store.saveTipos()}
  let k=0;for(const [id,j] of Object.entries(d.juegos)){if(j&&j.nombre){await store.saveJuego(id,j);k++}}
  for(const [id,r] of Object.entries(d.rutinas||{}))if(r&&r.nombre)await store.saveRutina(id,r);
  closeSheet();toast(`${k} juegos cargados 🎩`)}

/* ---------- Brillitos ---------- */
function sparkles(el,n=10){if(!el||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=el.getBoundingClientRect();
  for(let i=0;i<n;i++){const s=document.createElement('span');s.className='sparkle';s.textContent=['✨','♠','💫','♥'][i%4];
    s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';const a=Math.random()*Math.PI*2,d=60+Math.random()*90;
    s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}

/* ================= Eventos ================= */
function switchTab(t){if(S.tab===t&&t==='rutinas'){S.rut=null}S.tab=t;document.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  ['juegos','rutinas'].forEach(x=>$('#tab-'+x).hidden=x!==t);$('#hdr-juegos').hidden=t!=='juegos';window.scrollTo(0,0);render()}
document.querySelector('.tabbar').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)switchTab(b.dataset.tab)});
$('#q').addEventListener('input',e=>{S.q=e.target.value;render()});
$('#fab').addEventListener('click',()=>{if(S.tab==='juegos')openEdit();else if(S.rut)pickJuegos(S.rut);else newRutina()});
$('#open-settings').addEventListener('click',openSettings);
$('#azar').addEventListener('click',e=>{const r=list().filter(matches);if(!r.length){toast('No hay juegos con estos filtros');return}
  const w=r.flatMap(j=>Array(j.fav?3:1).fill(j));sparkles(e.currentTarget,12);const j=w[Math.floor(Math.random()*w.length)];setTimeout(()=>openDetail(j.id),350)});
document.addEventListener('click',async e=>{
  const t=e.target;if(t.closest('.sheet')||t.closest('.perform'))return;
  const o=t.closest('[data-open]');if(o){openDetail(o.dataset.open);return}
  if(t.closest('[data-new]')){openEdit();return}
  if(t.closest('#tipos-open')){openTipos();return}
  const c=t.closest('[data-cat]');if(c){S.cat=c.dataset.cat;render();return}
  const l=t.closest('[data-lv]');if(l){S.lv=S.lv===l.dataset.lv?'':l.dataset.lv;render();return}
  const ru=t.closest('[data-rut]');if(ru){S.rut=ru.dataset.rut;window.scrollTo(0,0);render();return}
  if(t.closest('[data-rback]')){S.rut=null;render();return}
  if(t.closest('[data-rren]')){renameRutina(S.rut);return}
  if(t.closest('[data-addj]')){pickJuegos(S.rut);return}
  const mv=t.closest('[data-mv]');if(mv){const r=S.rutinas[S.rut];const ids=rutIds(r);const i=+mv.dataset.mv,d=+mv.dataset.d;[ids[i],ids[i+d]]=[ids[i+d],ids[i]];store.saveRutina(S.rut,{...r,ids});return}
  const rm=t.closest('[data-rm]');if(rm){const r=S.rutinas[S.rut];store.saveRutina(S.rut,{...r,ids:(r.ids||[]).filter(x=>x!==rm.dataset.rm)});return}
  if(t.closest('#perform')){openPerform(0);return}
  const rd=t.closest('#rut-del');if(rd){if(rd.dataset.sure){store.deleteRutina(S.rut);toast('Rutina borrada')}else{rd.dataset.sure=1;rd.textContent='¿Seguro? Pulsa otra vez'}return}
  if(t.closest('#load-ej')){for(const j of EJEMPLOS)await store.saveJuego(newId(),{...j,creado:today(),veces:0});toast('Ejemplos cargados. Bórralos cuando quieras');return}
});

/* ---------- Cielo estrellado ---------- */
(function(){const cv=$('#stars'),cx=cv.getContext('2d');let st=[];
  function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
    st=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:(Math.random()*1.3+.3)*devicePixelRatio,p:Math.random()*6.28,s:.5+Math.random()*1.5}))}
  size();addEventListener('resize',size);
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function draw(t){cx.clearRect(0,0,cv.width,cv.height);for(const s of st){cx.globalAlpha=.35+.65*Math.abs(Math.sin(s.p+t/1000*s.s));cx.fillStyle=s.r>1.4*devicePixelRatio?'#D9CCFF':'#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fill()}
    if(!still)requestAnimationFrame(draw)}
  requestAnimationFrame(draw)})();

setTimeout(()=>{const s=$('#splash');s.classList.add('out');setTimeout(()=>s.remove(),500)},1400);
boot();
</script>
